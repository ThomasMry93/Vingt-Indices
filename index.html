it.","Je suis le mammifère aux ailes de cuir."]},{"id":"c548","cat":"Chose","theme":"Chose","answer":"Le hérisson","clues":["Je porte des milliers de piquants.","Je me roule en boule.","J'hiberne.","Je sors la nuit.","Je mange des limaces et des insectes.","Le lait de vache me rend malade.","Sonic est de mon espèce.","Beaucoup des miens meurent écrasés sur les routes.","Je suis protégé en France.","Je résiste en partie au venin de vipère.","Je renifle et je grogne bruyamment.","À la naissance, mes piquants sont cachés sous la peau.","Je m'enduis les piquants de ma propre salive.","Je suis un petit mammifère insectivore.","Je fréquente les jardins.","Mon ventre n'a pas de piquants.","Chez Beatrix Potter, Mrs. Tiggy-Winkle est une blanchisseuse de mon espèce.","Les jardiniers m'aiment car je mange les limaces.","On me laisse une coupelle d'eau dans le jardin.","Je suis la petite boule piquante des haies."]},{"id":"c549","cat":"Chose","theme":"Chose","answer":"L'écureuil","clues":["Ma queue est un panache touffu.","Je cache des noisettes et j'en oublie beaucoup.","Les graines que j'oublie font pousser des arbres.","Je suis un rongeur.","Tic et Tac sont de ma famille.","Scrat, dans « L'Âge de glace », court après son gland.","Je suis le logo de la Caisse d'Épargne.","Au Royaume-Uni, mon cousin gris menace le roux.","Mon nid sphérique s'appelle une hutte.","Je n'hiberne pas.","Je descends des arbres la tête la première.","Mon cousin volant plane d'arbre en arbre.","Je suis protégé en France.","Je décortique les pommes de pin.","La marmotte est ma cousine.","Dans la mythologie nordique, Ratatoskr court le long du grand frêne.","Un hélicoptère léger d'Airbus porte mon nom.","Mes poils servaient à faire des pinceaux fins.","Je saute de branche en branche.","Je suis la petite bête rousse des parcs."]},{"id":"c550","cat":"Chose","theme":"Chose","answer":"Le chameau","clues":["J'ai deux bosses.","Mes bosses contiennent de la graisse, pas de l'eau.","Je peux boire plus de 100 litres en quelques minutes.","Je vis notamment dans le désert de Gobi.","Le dromadaire, mon cousin, n'a qu'une bosse.","Je crache quand je suis contrarié.","J'ai une double rangée de cils.","Je peux fermer mes narines contre le sable.","On boit mon lait.","J'ai porté les marchandises sur la route de la soie.","Selon l'Évangile, je passe plus aisément par le chas d'une aiguille qu'un riche.","Ma laine est très chaude.","On traite de mon nom une personne méchante.","Mes globules rouges sont ovales.","Ma température varie pour économiser l'eau.","Mon espèce sauvage est en danger critique.","Je blatère.","J'ai des callosités aux genoux.","Mes larges pieds ne s'enfoncent pas dans le sable.","Je suis le vaisseau du désert d'Asie."]},{"id":"c551","cat":"Chose","theme":"Chose","answer":"La baguette","clues":["Mes entailles sur le dessus s'appellent des grignes.","Je suis le pain le plus emblématique de France.","Un décret de 1993 encadre ma version « de tradition française ».","Le lendemain, je suis souvent dure comme du bois.","Je pèse traditionnellement environ 250 grammes.","On me glisse sous le bras dans les clichés sur les Français.","Un concours désigne chaque année ma meilleure version à Paris.","Le gagnant de ce concours fournit l'Élysée pendant un an.","Ma petite sœur, plus fine, s'appelle la ficelle.","Coupée en deux, je deviens un sandwich jambon-beurre.","Ma mie est pleine de trous irréguliers : on la dit alvéolée.","Mon savoir-faire artisanal est inscrit à l'UNESCO depuis 2022.","On peut me demander « bien cuite » ou « pas trop cuite ».","Je mesure en général entre 50 et 70 centimètres.","Mon bout, le quignon, est souvent grignoté avant d'arriver à la maison.","Ma version « tradition » ne contient que farine, eau, sel et levure ou levain.","Il s'en vend des millions chaque jour en France.","Je suis longue et dorée, avec une croûte qui craque.","Rassise, je peux finir en pain perdu.","Avec du beurre et de la confiture, je deviens une tartine."]},{"id":"c552","cat":"Chose","theme":"Chose","answer":"La pizza","clues":["Mes bords gonflés s'appellent le cornicione.","Je suis née à Naples.","Ma version « reine » mêle jambon et champignons.","On raconte que ma version la plus célèbre honore une reine d'Italie.","L'art de mes artisans napolitains est inscrit à l'UNESCO depuis 2017.","Ma version à l'ananas, dite hawaïenne, a été inventée au Canada.","Les Tortues Ninja raffolent de moi.","Je suis ronde, garnie de tomate et de mozzarella.","Ma version calzone est pliée en deux.","On me cuit idéalement au four à bois.","À Chicago, on me fait très épaisse, en « deep dish ».","Mon artisan fait tourner ma pâte dans les airs.","Ma version Margherita reprend les couleurs du drapeau italien.","On me livre souvent à domicile dans une boîte en carton.","À Naples, une association protège ma recette dite « verace ».","L'origan et le basilic me parfument souvent.","On me découpe en parts triangulaires.","Ma version « quatre saisons » est divisée en quatre garnitures.","Ma pâte est faite de farine, d'eau, de sel et de levure.","La France est l'un des plus gros pays consommateurs de moi au monde."]},{"id":"c553","cat":"Chose","theme":"Chose","answer":"Le chocolat","clues":["Les fèves dont je suis issu servaient de monnaie aux Aztèques.","Je suis toxique pour les chiens.","Mon nom viendrait de la langue des Aztèques, le nahuatl.","À Pâques, je prends la forme d'œufs, de cloches et de lapins.","Ma version blanche ne contient que du beurre de cacao, sans pâte de cacao.","Je suis arrivé en Europe par l'Espagne au XVIe siècle.","Willy Wonka dirige une usine entièrement consacrée à moi.","Je fonds à peu près à la température du corps.","La Côte d'Ivoire est le premier producteur de ma matière première.","Je peux être noir, au lait ou blanc.","Mon tempérage me donne brillance et craquant.","Bayonne fut l'une de mes premières capitales en France.","Je suis vendu en tablettes, souvent découpées en carrés.","Les Aztèques me buvaient épicé et amer.","Je contiens de la théobromine.","Un grand salon m'est consacré chaque automne à Paris depuis 1995.","On me boit chaud en hiver.","La Suisse et la Belgique sont réputées pour me fabriquer.","On parle de mon pourcentage de cacao pour me déguster.","Je viens des fèves du cacaoyer."]},{"id":"c554","cat":"Chose","theme":"Chose","answer":"La raclette","clues":["Ma version du Valais bénéficie d'une AOP en Suisse.","On m'accompagne de pommes de terre en robe des champs.","Je suis un fromage au lait de vache.","Autrefois, on me faisait fondre devant un feu de bois.","Ma version de Savoie a obtenu une IGP en 2017.","Cornichons et petits oignons au vinaigre m'accompagnent.","Je laisse une forte odeur dans la maison après le repas.","Mon appareil électrique a des petits poêlons individuels.","Je suis née dans le Valais, en Suisse.","Ma meule peut être coupée en deux et chauffée par la tranche.","Jambon cru, rosette et viande des Grisons me tiennent compagnie.","Je suis la star des soirées d'hiver entre amis.","On coupe mon fromage en tranches pour les glisser sous le gril.","Ma croûte se mange une fois grillée.","Je suis la cousine de la tartiflette, autre star savoyarde.","On conseille souvent de boire du vin blanc ou du thé avec moi.","Mon appareil trône au milieu de la table et chacun se sert.","La Savoie est ma terre d'adoption en France.","On me prépare surtout quand il fait froid dehors.","Mon fromage fond et coule sur l'assiette."]},{"id":"c555","cat":"Chose","theme":"Chose","answer":"Les sushis","clues":["Notre algue s'appelle le nori.","Nous venons du Japon.","À l'origine, nous étions une façon de conserver le poisson dans du riz fermenté.","On nous trempe dans la sauce soja.","Le gingembre mariné sert à se rincer la bouche entre deux d'entre nous.","Nos versions roulées dans l'algue s'appellent des makis.","Notre version en cône s'appelle le temaki.","Le saumon est notre poisson le plus populaire en France.","Nous défilons parfois sur un tapis roulant au restaurant.","Le « California roll » a son riz à l'extérieur.","Notre riz est assaisonné au vinaigre.","On roule nos makis avec une natte en bambou.","Le wasabi, pâte verte piquante, nous accompagne.","Jiro, maître de Tokyo, nous a consacré sa vie dans un documentaire de 2011.","Nos versions avec une tranche de poisson posée sur le riz sont les nigiris.","Le sashimi, c'est notre poisson sans le riz.","On nous mange avec des baguettes.","Le thon rouge est l'un de nos poissons les plus prisés.","Au Japon, devenir notre chef demande des années d'apprentissage.","Nos pièces se mangent souvent en une seule bouchée."]},{"id":"c556","cat":"Chose","theme":"Chose","answer":"Le café","clues":["Le port yéménite de Moka m'a longtemps exporté.","On me boit souvent noir et serré.","Mes deux grandes variétés sont l'arabica et le robusta.","Une légende raconte qu'un berger éthiopien m'a découvert grâce à ses chèvres.","Le Brésil est mon premier producteur mondial.","Dans un bar français, on me commande au comptoir.","Mes grains poussent dans des fruits rouges appelés cerises.","Avec du lait chaud mousseux, je deviens cappuccino.","Le Vietnam est mon deuxième producteur mondial.","On me torréfie avant de me moudre.","Certains lisent l'avenir dans le marc qui reste au fond de la tasse.","Le Procope, à Paris, me sert depuis 1686.","Je réveille le matin et j'empêche parfois de dormir.","Ma version « allongée » est plus diluée.","On me prépare en machine, à piston ou en filtre.","Je suis aussi le nom d'un lieu où l'on va boire un verre.","Le latte art dessine des cœurs à ma surface.","Servi avec des mignardises, on me dit « gourmand ».","Mon expresso italien se boit en quelques gorgées.","Je donne mon nom à une couleur brun foncé."]},{"id":"c557","cat":"Chose","theme":"Chose","answer":"La fraise","clues":["Les petits grains à ma surface sont mes vrais fruits, les akènes.","Je suis rouge et parsemée de petits grains.","Je donne mon nom à une collerette plissée portée à la Renaissance.","Plougastel, en Bretagne, est célèbre pour me cultiver.","Botaniquement, je suis un faux-fruit.","Je me déguste volontiers avec de la chantilly.","Ma plante se multiplie grâce à des stolons.","Amédée Frézier a ramené du Chili une espèce qui m'a fait grossir.","Ma variété gariguette est très appréciée au printemps.","Chez le dentiste, mon homonyme est un instrument rotatif.","Dans une expression familière, on me « ramène » quand on se mêle de tout.","Ma variété mara des bois rappelle le goût sauvage.","Ma saison en France va surtout d'avril à juin.","Je ne mûris plus une fois cueillie.","Mon nom anglais contient le mot « paille ».","Ma petite sœur sauvage pousse dans les sous-bois.","On me sert en tarte sur une crème pâtissière.","L'Espagne m'exporte beaucoup en France au début du printemps.","Je suis riche en vitamine C.","Je suis l'un des parfums de glace les plus courants."]},{"id":"c558","cat":"Chose","theme":"Chose","answer":"Le croissant","clues":["Mon ancêtre autrichien s'appelle le kipferl.","On me trempe dans le café au lait le matin.","En boulangerie, ma version au beurre est droite et l'ordinaire courbée.","On raconte que ma forme évoque l'emblème ottoman après le siège de Vienne.","Je porte le nom d'une forme de la lune.","Ma pâte est tourée plusieurs fois avec du beurre.","Je laisse plein de miettes feuilletées partout.","Ma version aux amandes est faite avec un exemplaire de la veille.","Le drapeau turc arbore la même forme que moi.","On me fabrique en roulant un triangle de pâte.","Avec le pain au chocolat, je trône au petit-déjeuner.","Garni de jambon et de béchamel, je deviens un plat salé.","Un boulanger autrichien, August Zang, a popularisé mon ancêtre à Paris vers 1838.","Mon intérieur forme des alvéoles en nid d'abeille.","Je suis une viennoiserie en pâte feuilletée levée.","On me badigeonne de jaune d'œuf avant cuisson pour me dorer.","Ma recette est venue de Vienne avant de devenir française.","On m'achète à l'unité en boulangerie.","Dans les hôtels, on me sert avec un jus d'orange.","On me déguste surtout le matin ou au goûter."]},{"id":"c559","cat":"Chose","theme":"Chose","answer":"La crêpe","clues":["La plaque bretonne pour me cuire s'appelle une billig.","Le 2 février, à la Chandeleur, on me fait sauter.","On dit qu'il faut me faire sauter une pièce à la main pour la prospérité.","Ma cousine salée au sarrasin s'appelle la galette.","Je suis très fine et ronde.","On m'étale avec un petit râteau en bois.","Ma version Suzette est flambée à la liqueur d'orange.","La première de la série sort souvent ratée.","La Bretagne est ma région emblème.","On me sert avec du cidre, dans une bolée.","Mon garnissage le plus simple : beurre et sucre.","Ma pâte mêle farine, œufs et lait.","Ma pâte doit souvent reposer avant la cuisson.","Ronde et dorée, je rappellerais le soleil.","On me plie en quatre ou en triangle.","Dans la rue, on me sert dans un cornet de papier.","Familièrement, on traite de mon nom une personne un peu niaise.","En Russie, mes cousines plus épaisses se nomment blinis.","Garnie de pâte à tartiner, je suis le goûter préféré des enfants.","On me retourne d'un coup de poignet dans la poêle."]},{"id":"c560","cat":"Chose","theme":"Chose","answer":"Le camembert","clues":["Les collectionneurs de mes étiquettes sont des tyrosémiophiles.","Je viens de Normandie.","Marie Harel est réputée m'avoir créé vers 1791.","Je porte le nom d'un village de l'Orne.","On me vend dans une boîte ronde en bois.","Ma boîte en bois a été inventée vers 1890.","Dalí disait que mes formes coulantes avaient inspiré ses montres molles.","Je suis un fromage à pâte molle et à croûte fleurie.","Mon AOP « de Normandie » impose le lait cru.","Ma croûte blanche est due à un Penicillium.","Les soldats de 14-18 me recevaient dans leurs rations.","Je sens fort quand je suis bien fait.","On me fait parfois rôtir entier au four.","Je mesure environ 11 centimètres de diamètre.","Je pèse environ 250 grammes.","Jeune, mon cœur reste parfois plâtreux.","On me coupe en parts triangulaires, comme un gâteau.","Une statue de ma créatrice se dresse à Vimoutiers.","On me presse du pouce pour savoir si je suis à point.","Je suis l'un des fromages les plus emblématiques de France."]},{"id":"c561","cat":"Chose","theme":"Chose","answer":"Le champagne","clues":["Ma bouteille de 15 litres s'appelle un nabuchodonosor.","On me sabre pour fêter une victoire.","Reims et Épernay sont mes capitales.","Le moine dom Pérignon est associé à mon histoire.","Mes cépages principaux sont le chardonnay, le pinot noir et le meunier.","Mon bouchon est retenu par un muselet.","La pression dans ma bouteille atteint environ 6 bars.","Je suis un vin effervescent du nord-est de la France.","On fait tourner mes bouteilles sur des pupitres : c'est le remuage.","Mes coteaux, maisons et caves sont inscrits à l'UNESCO depuis 2015.","Une célèbre veuve a inventé la table de remuage au XIXe siècle.","On me boit au réveillon du Nouvel An.","Les pilotes de F1 m'arrosent sur le podium.","Le « brut » est ma version peu sucrée.","Ma version « blanc de blancs » n'utilise que du chardonnay.","On me sert dans une flûte ou une coupe.","Je ne peux porter mon nom que si je viens de ma région.","On baptise les navires en brisant ma bouteille sur la coque.","Mes caves creusées dans la craie s'étendent sur des kilomètres sous Reims.","Ma prise de mousse se fait en bouteille."]},{"id":"c562","cat":"Chose","theme":"Chose","answer":"La ratatouille","clues":["Le critique Anton Ego retombe en enfance en me goûtant.","Courgette, aubergine, poivron et tomate me composent.","Un film Pixar de 2007 porte mon nom.","Je suis une spécialité niçoise.","Dans ce film, un rat nommé Rémy rêve de devenir chef.","Le chef imaginaire de ce film s'appelle Gusteau.","On me sert chaude ou froide.","Mon cousin basque, avec piments et œufs, est la piperade.","Oignons, ail et herbes de Provence me parfument.","Je suis entièrement végétarienne.","Ma version du film a été imaginée par le chef américain Thomas Keller.","On peut cuire mes légumes séparément avant de les réunir.","Mon cousin espagnol s'appelle le pisto.","Je suis l'été dans une assiette.","Mon nom désignait autrefois un ragoût peu appétissant.","J'accompagne volontiers un poisson ou une viande grillée.","Le film qui porte mon nom se passe à Paris.","Je me congèle bien, idéale à préparer en grande quantité.","L'huile d'olive est indispensable à ma cuisson.","Je mijote doucement en cocotte."]},{"id":"c563","cat":"Chose","theme":"Chose","answer":"Le cassoulet","clues":["Une Grande Confrérie me défend à Castelnaudary.","Je suis un plat du Sud-Ouest à base de haricots blancs.","La légende dit qu'on doit casser ma croûte sept fois.","Castelnaudary se dit ma capitale.","Je cuis dans un plat en terre cuite d'Issel.","Saucisse de Toulouse et confit de canard me garnissent.","Toulouse et Carcassonne revendiquent aussi ma paternité.","Une légende me fait naître pendant un siège de la guerre de Cent Ans.","Les haricots lingots sont mes préférés.","Je mijote pendant des heures.","Le Lauragais est ma terre natale.","On me vend aussi en conserve.","La couenne de porc fait partie de ma recette.","Je suis souvent meilleur réchauffé le lendemain.","Ma version de Carcassonne peut inclure de la perdrix ou du mouton.","Je suis un plat d'hiver très nourrissant.","Mon plat de cuisson s'évase vers le haut.","Le haricot tarbais est aussi utilisé dans ma recette.","Je suis réputé lourd à digérer.","On me sert directement dans mon plat de cuisson."]},{"id":"c564","cat":"Chose","theme":"Chose","answer":"La bouillabaisse","clues":["Une charte de 1980 fixe ma recette.","Je suis la grande soupe de poissons de Marseille.","La rascasse est indispensable chez moi.","On me sert en deux temps : la soupe d'abord, puis les poissons.","Ma cousine de Sète s'appelle la bourride.","La rouille m'accompagne sur des croûtons frottés à l'ail.","Le safran me donne ma couleur dorée.","J'étais à l'origine le plat des pêcheurs, fait avec leurs invendus.","Le Vieux-Port est mon quartier.","Saint-pierre, congre, grondin et vive peuvent me composer.","Je suis souvent un plat cher au restaurant.","Le fenouil me parfume.","On découpe les poissons devant le client.","Huile d'olive, tomate et ail sont dans ma recette.","Je suis une spécialité provençale.","Il me faut de nombreux poissons de roche.","On raconte que les Grecs de Massalia préparaient déjà mon ancêtre.","Je cuis sur un feu vif, à ébullition franche.","Des pommes de terre peuvent cuire dans ma soupe.","On me sert dans une assiette creuse, à la louche."]},{"id":"c565","cat":"Chose","theme":"Chose","answer":"Le couscous","clues":["Mon nom est d'origine berbère.","Je suis à base de semoule de blé dur.","Mon savoir-faire est inscrit à l'UNESCO depuis 2020, porté par quatre pays.","Je viens du Maghreb.","Ma version royale réunit plusieurs viandes.","On me cuit à la vapeur, au-dessus du bouillon.","Un film d'Abdellatif Kechiche de 2007 tourne autour d'un restaurant qui me sert.","Merguez, poulet et agneau me garnissent.","Pois chiches, carottes, navets et courgettes m'accompagnent.","Au Maroc, on me prépare souvent le vendredi.","La harissa relève mon bouillon.","À Trapani, en Sicile, on me prépare au poisson.","Ma version sucrée, au beurre, cannelle et raisins secs, s'appelle seffa.","Je suis régulièrement cité parmi les plats préférés des Français.","On roule mes grains à la main.","Le ras-el-hanout peut parfumer ma préparation.","On égrène ma semoule à la fourchette.","Mon voisin de table marocain est le tajine.","Je suis souvent servi lors des grandes fêtes familiales.","On arrose ma semoule de bouillon dans l'assiette."]},{"id":"c566","cat":"Chose","theme":"Chose","answer":"Les escargots","clues":["Notre élevage s'appelle l'héliciculture.","On nous prépare au beurre persillé à l'ail.","Nous portons notre maison sur le dos.","Nous sommes hermaphrodites.","Julia Roberts en envoie un voler dans Pretty Woman.","On nous mange avec une pince et une petite fourchette.","Nous sommes des gastéropodes.","Notre espèce la plus célèbre porte le nom d'une région française.","L'hiver, nous fermons notre coquille par un épiphragme.","Le petit-gris est l'une de nos variétés.","On nous sert souvent par douzaine.","Nous sortons après la pluie.","Nous laissons une trace de bave derrière nous.","Notre bave est utilisée en cosmétique.","Nous sommes servis dans un plat à alvéoles.","Beaucoup d'entre nous, servis en France, sont importés d'Europe de l'Est.","Nos yeux sont au bout de nos tentacules.","Nous sommes réputés très lents.","On nous sert volontiers au réveillon de Noël.","Nous sommes un cliché de la gastronomie française à l'étranger."]},{"id":"c567","cat":"Chose","theme":"Chose","answer":"Le macaron","clues":["À Nancy, deux religieuses ont rendu célèbre ma version craquelée.","Je suis fait de deux coques collées par une garniture.","Ma coque est à base de poudre d'amande, de sucre et de blanc d'œuf.","Ma petite collerette en bas de coque s'appelle le pied.","Le 20 mars, une journée m'est consacrée.","Je suis de toutes les couleurs.","Saint-Émilion et Amiens ont aussi leur version de moi.","Ganache, confiture ou crème au beurre me garnissent.","Un pâtissier parisien aurait eu l'idée de coller mes deux coques.","On me déguste en une ou deux bouchées.","Une meringue entre dans ma pâte.","On m'empile en pyramide pour les mariages.","On me range dans de jolies boîtes cadeaux.","Je suis capricieux et difficile à réussir.","Je gagne à reposer au frais 24 heures avant d'être mangé.","On dit que Catherine de Médicis m'aurait apporté d'Italie.","Pistache, chocolat, framboise et vanille sont mes parfums classiques.","Je mesure de 3 à 5 centimètres de diamètre.","Sans farine de blé, je suis naturellement sans gluten.","Ma surface doit être lisse et brillante."]},{"id":"c568","cat":"Chose","theme":"Chose","answer":"La paella","clues":["La croûte grillée au fond de ma poêle s'appelle le socarrat.","Je viens de Valence, en Espagne.","Je suis un plat de riz cuit dans une grande poêle plate.","Ma poêle porte le même nom que moi.","Ma version valencienne contient poulet, lapin et haricots verts.","On ne me remue pas pendant la cuisson.","Le safran me colore en jaune.","Le riz bomba me convient parfaitement.","Mon nom viendrait du latin « patella », un plat.","Ma version aux fruits de mer est la plus connue à l'étranger.","Le chorizo ne fait pas partie de ma recette traditionnelle.","On me cuit traditionnellement au feu de bois, en plein air.","Des escargots figurent parfois dans ma recette valencienne.","Moules, crevettes et langoustines décorent ma surface.","Je suis le plat du dimanche en famille à Valence.","On me partage directement dans le plat.","Sur les marchés, on me prépare pour des dizaines de personnes.","On me sert avec des quartiers de citron.","Mon riz absorbe tout le bouillon.","Je suis la star des vacances en Espagne."]},{"id":"c569","cat":"Chose","theme":"Chose","answer":"Le hamburger","clues":["Un petit restaurant de New Haven revendique ma création en 1900.","Je suis un steak haché entre deux pains ronds.","Mon pain rond est souvent parsemé de sésame.","Le magazine The Economist compare mon prix d'un pays à l'autre.","Ma version « smash » est écrasée sur la plaque.","Je suis le roi de la restauration rapide.","Salade, tomate, oignon et cornichon me garnissent.","Mon petit pain s'appelle un « bun ».","Avec une tranche de fromage fondu, je prends un nom anglais.","On me sert avec des frites et un soda.","Dans Pulp Fiction, Samuel L. Jackson croque dans l'un de moi.","Mon steak se commande saignant, à point ou bien cuit.","Je suis un symbole de la cuisine américaine.","On me mange avec les mains.","Ketchup et moutarde coulent souvent de moi.","Ma version végétarienne remplace la viande par des légumes.","On me superpose parfois en double ou triple étage.","Les grands chefs ont aussi fait de moi un plat gastronomique.","Je suis servi dans les diners américains.","Mon steak est le plus souvent de bœuf."]},{"id":"c570","cat":"Chose","theme":"Chose","answer":"Les frites","clues":["La bintje est notre variété de pomme de terre préférée.","Nous sommes des bâtonnets de pomme de terre.","Belges et Français se disputent notre origine.","En Belgique, on nous cuit deux fois, dans de la graisse de bœuf.","Un musée nous est consacré à Bruges.","Avec des moules, nous formons un duo célèbre du Nord.","Notre version épaisse s'appelle pont-neuf.","Au Canada, avec du fromage en grains et une sauce brune, nous devenons la poutine.","On nous sert dans un cornet en papier.","Notre version très fine s'appelle allumettes.","Quand on est en pleine forme, on dit qu'on nous « a ».","En Belgique, on nous achète dans une baraque.","La mayonnaise nous accompagne en Belgique.","Notre double cuisson nous rend croustillantes dehors et fondantes dedans.","Les Américains nous appellent « french fries ».","On nous sale à la sortie du bain d'huile.","Nous accompagnons le steak.","On nous cuit dans une huile autour de 170 à 180 °C.","Nous sommes l'accompagnement roi des fast-foods.","Notre version maison peut se faire au four, moins grasse."]},{"id":"c571","cat":"Chose","theme":"Chose","answer":"Le thé","clues":["Une légende attribue ma découverte à l'empereur chinois Shennong.","Après l'eau, je suis la boisson la plus bue au monde.","Je suis fait des feuilles du Camellia sinensis.","En 1773, on m'a jeté dans le port de Boston.","Au Maroc, on me sert à la menthe, versé de haut.","Les Anglais me prennent à cinq heures.","Au Japon, ma cérémonie s'appelle le chanoyu.","Mon matcha est une poudre verte japonaise.","Noir, vert, blanc ou oolong : je change selon l'oxydation.","Le Darjeeling est l'une de mes régions indiennes réputées.","Je contiens la même molécule excitante que le café.","On me laisse infuser quelques minutes.","Je me vends en sachets ou en vrac.","Parfumé à la bergamote, je deviens l'Earl Grey.","Le chaï indien est ma version épicée au lait.","Le Chapelier fou m'organise une fête dans Alice au pays des merveilles.","À Taïwan, on me sert avec des perles de tapioca.","La Chine est mon premier producteur.","Les Britanniques me boivent souvent avec un nuage de lait.","Le samovar russe sert à me préparer."]},{"id":"c572","cat":"Chose","theme":"Chose","answer":"La tomate","clues":["En 1893, la Cour suprême américaine m'a classée parmi les légumes.","Botaniquement, je suis un fruit.","Mes ancêtres sauvages viennent des Andes.","Les Européens m'ont longtemps crue toxique.","On m'appelait autrefois « pomme d'amour ».","Je suis la base du ketchup.","En italien, mon nom signifie « pomme d'or ».","Je suis de la famille des solanacées, comme la pomme de terre.","Chaque été, à Buñol en Espagne, une bataille géante se fait à coups de moi.","Ma variété cœur-de-bœuf est très grosse.","Mes petites versions s'appellent cerises ou cocktail.","Je suis riche en lycopène.","Mon plant dégage une odeur forte quand on le frôle.","Je peux être rouge, mais aussi jaune, verte ou noire.","Avec la mozzarella et le basilic, je forme la salade caprese.","Je suis la base du gaspacho.","Farcie, je suis un classique de l'été.","On me lance sur les mauvais artistes, dans les clichés.","Mon jus entre dans le cocktail Bloody Mary.","Mon plant a besoin d'un tuteur pour grimper."]},{"id":"c573","cat":"Chose","theme":"Chose","answer":"La pomme de terre","clues":["En 1995, j'ai été la première plante vivrière cultivée dans l'espace.","Je viens des Andes, au Pérou.","Parmentier m'a popularisée en France au XVIIIe siècle.","Je suis un tubercule.","On raconte que Parmentier fit garder un champ de moi pour attiser la curiosité.","Mes yeux sont des bourgeons qui germent.","Mes germes et mes parties vertes contiennent de la solanine, toxique.","Le mildiou qui m'a frappée a causé une grande famine en Irlande en 1845.","On me fait en purée, en frites ou en gratin.","Familièrement, on m'appelle « patate ».","La bintje, la charlotte et la ratte sont mes variétés.","Le doryphore est un insecte qui ravage mes feuilles.","Je suis l'ingrédient principal de la tartiflette.","Un jouet de Toy Story est fait à mon image.","La Chine est mon premier producteur mondial.","On m'épluche avec un économe.","En robe des champs, je cuis avec ma peau.","Au Pérou, il existe des milliers de mes variétés.","Ma fécule sert à épaissir les sauces.","Le hachis porte le nom de mon grand défenseur."]},{"id":"c574","cat":"Chose","theme":"Chose","answer":"Le miel","clues":["On m'a retrouvé encore comestible dans des tombes égyptiennes.","Les abeilles me fabriquent à partir du nectar des fleurs.","Je ne me périme quasiment jamais.","Winnie l'ourson raffole de moi.","Je cristallise avec le temps.","Ma version d'acacia reste liquide longtemps.","Ma version de manuka vient de Nouvelle-Zélande.","On évite de me donner aux bébés de moins d'un an.","L'apiculteur me récolte dans la ruche.","Je suis stocké dans des alvéoles hexagonales de cire.","Je suis le principal ingrédient de l'hydromel.","Une abeille n'en produit qu'une infime fraction de cuillère dans sa vie.","Les jeunes mariés partent en lune de… moi.","On me prend pour adoucir la gorge.","Je suis un ingrédient traditionnel du pain d'épices.","La lavande, le châtaignier ou le thym me donnent des saveurs différentes.","Ma couleur va du blanc presque transparent au brun foncé.","La Chine est mon premier producteur mondial.","On m'utilise depuis l'Antiquité pour soigner les plaies.","Je sucre le thé et les tartines."]},{"id":"c575","cat":"Chose","theme":"Chose","answer":"La galette des rois","clues":["Les collectionneurs de mes fèves s'appellent des fabophiles.","On me partage pour l'Épiphanie, début janvier.","Je cache une fève.","Celui qui trouve la fève porte une couronne en papier.","Le plus jeune se glisse sous la table pour désigner les parts.","Ma version du Nord est garnie de frangipane.","Dans le Sud, ma cousine est une brioche aux fruits confits.","Ma fève était à l'origine un vrai légume sec.","L'Élysée en commande une version géante sans fève.","Je suis faite de pâte feuilletée.","Ma frangipane mêle crème d'amandes et crème pâtissière.","On dessine des motifs sur moi au couteau avant cuisson.","Je célèbre la visite des Mages à l'Enfant Jésus.","Mes fèves sont aujourd'hui en porcelaine ou en plastique.","Une tradition voulait qu'on garde une part pour le pauvre.","On dit qu'on me « tire » plutôt qu'on me coupe.","Mes origines remonteraient aux Saturnales romaines.","On me mange pendant tout le mois de janvier.","Le cidre m'accompagne souvent.","La boulangerie me vend avec une couronne dorée."]},{"id":"c576","cat":"Chose","theme":"Chose","answer":"Le foie gras","clues":["Les Égyptiens de l'Antiquité gavaient déjà les oies.","On me produit à partir d'un canard ou d'une oie.","On me sert au réveillon de Noël.","Le Sud-Ouest et l'Alsace sont mes terres de tradition.","Un sauternes est mon vin classique.","On me prépare en terrine ou mi-cuit.","Une loi de 2006 me reconnaît comme patrimoine gastronomique protégé en France.","On m'accompagne de pain d'épices ou de figues.","La France est mon premier producteur mondial.","Ma production est interdite dans plusieurs pays.","On me tranche avec un couteau trempé dans l'eau chaude.","Le canard fournit aujourd'hui l'essentiel de ma production.","Ma production fait débat à cause du gavage.","On me poêle en escalopes.","Je suis un organe hypertrophié.","Strasbourg s'est rendue célèbre au XVIIIe siècle avec un pâté de moi en croûte.","Mon « bloc » est fait de morceaux reconstitués.","On m'assaisonne de fleur de sel et de poivre.","Un chutney d'oignons m'accompagne volontiers.","On me sert froid en entrée, avec du pain grillé."]},{"id":"c577","cat":"Chose","theme":"Chose","answer":"La bûche de Noël","clues":["Je rappelle la coutume de brûler un gros morceau de bois dans la cheminée.","Ma forme imite un morceau de bois.","Je suis le dessert des fêtes de fin d'année.","De petits champignons en meringue me décorent.","Je suis un biscuit roulé garni de crème.","Ma version glacée se garde au congélateur.","Un petit sapin en plastique orne parfois mon dessus.","On me strie à la fourchette pour imiter l'écorce.","Le chocolat est mon parfum le plus classique.","Je serais apparue au XIXe siècle à Paris.","Les pâtissiers rivalisent chaque décembre pour me réinventer.","Je suis présentée sur un plateau allongé.","Mes extrémités sont souvent coupées en biais.","Je termine le repas du réveillon, après la dinde.","Un personnage barbu en sucre trône souvent sur moi.","La crème au beurre était ma garniture d'antan.","Je remplis le rayon des surgelés en décembre.","Au Québec aussi, on me prépare pour les fêtes.","Je suis cylindrique.","On me partage en famille le 24 ou le 25 décembre."]},{"id":"c578","cat":"Chose","theme":"Chose","answer":"Les spaghettis","clues":["En 1957, un canular de la BBC nous montrait poussant sur des arbres.","Nous sommes des pâtes longues et fines.","Notre nom signifie « petites ficelles » en italien.","Dans La Belle et le Clochard, deux chiens partagent l'un de nous.","On nous enroule autour de la fourchette.","On doit nous cuire al dente.","Les westerns de Sergio Leone ont été surnommés d'après nous.","À la carbonara, nous retrouvons œufs, guanciale et pecorino.","On dit que Marco Polo nous aurait ramenés de Chine : c'est une légende.","On lance parfois l'un de nous contre le mur pour tester la cuisson.","Nous sommes faits de semoule de blé dur et d'eau.","Ail, huile et piment suffisent à notre recette la plus simple.","Alle vongole, on nous sert aux palourdes.","À Bologne, on préfère les tagliatelles pour la sauce qui nous rend célèbres.","Nous venons d'Italie.","On évite de nous casser avant de nous plonger dans l'eau.","Nous mesurons environ 25 centimètres.","On nous cuit dans une grande casserole d'eau bouillante salée.","Le parmesan râpé nous saupoudre.","Une cuillère aide parfois à nous enrouler."]},{"id":"c579","cat":"Chose","theme":"Chose","answer":"La banane","clues":["Mon plant n'est pas un arbre mais une herbe géante.","Je pousse en régimes.","Glisser sur ma peau est un gag classique.","Je suis riche en potassium.","Je suis très légèrement radioactive.","La Cavendish est ma variété la plus vendue.","La Guadeloupe et la Martinique me cultivent.","Mon cousin à cuire s'appelle le plantain.","Maurizio Cattelan m'a scotchée au mur dans une œuvre célèbre.","Andy Warhol m'a dessinée pour un album du Velvet Underground.","Quand on sourit jusqu'aux oreilles, on dit qu'on m'« a ».","La coiffure d'Elvis porte mon nom en français.","Je passe du vert au jaune, puis je me tache de brun.","Je fais mûrir les autres fruits grâce à l'éthylène.","Avec trois boules de glace, je deviens un split.","Un sac porté à la taille porte mon nom.","Les singes m'adorent dans les dessins animés.","L'Inde est mon premier producteur.","Je suis courbée car je pousse vers la lumière.","On m'épluche sans couteau."]},{"id":"c580","cat":"Chose","theme":"Chose","answer":"La pomme","clues":["Les ancêtres sauvages de mon arbre viennent du Kazakhstan.","Selon la tradition populaire, Ève m'a croquée au jardin d'Éden.","Newton aurait pensé à la gravité en me voyant tomber.","Blanche-Neige est empoisonnée en me croquant.","Guillaume Tell m'a transpercée sur la tête de son fils.","La golden, la granny smith et la gala sont mes variétés.","New York est surnommée la Grosse… moi, en anglais.","Je suis le fruit le plus consommé en France.","On me presse pour faire du cidre.","Le calvados est distillé à partir de mon cidre.","Un proverbe anglais dit qu'en manger une par jour éloigne le médecin.","Dans la mythologie, Pâris m'a offerte à Aphrodite.","Mes pépins contiennent un peu d'amygdaline.","Je flotte sur l'eau car je contiens de l'air.","Coupée, je brunis à l'air.","La Chine est mon premier producteur.","Ma compote est un dessert de base pour les bébés.","Mon arbre fleurit en blanc rosé au printemps.","Quand on s'évanouit, on tombe dans mes semblables.","Une marque d'informatique m'a prise pour logo, croquée."]},{"id":"c581","cat":"Chose","theme":"Chose","answer":"L'orange","clues":["La famille royale néerlandaise porte mon nom.","Je suis un agrume.","On m'offrait autrefois à Noël aux enfants, comme un cadeau précieux.","Je suis le jus du petit-déjeuner par excellence.","Ma variété sanguine a la chair rouge.","Une couleur porte mon nom.","Le Brésil est mon premier producteur.","La navel et la valencia sont mes variétés.","Je suis riche en vitamine C.","Je suis l'ingrédient vedette d'un célèbre plat de canard.","Mes quartiers se détachent facilement.","Je suis cousine de la clémentine et du pamplemousse.","Une liqueur triple sec est faite de mes écorces.","Séville est réputée pour ma variété amère.","Ma marmelade amère est une institution britannique.","Une ville du Vaucluse porte mon nom.","Mon arbre peut porter fleurs et fruits en même temps.","La Floride est l'un de mes grands producteurs.","Je viens à l'origine d'Asie.","Mon zeste parfume les gâteaux."]},{"id":"c582","cat":"Chose","theme":"Chose","answer":"Le citron","clues":["Menton fait une grande fête en mon honneur chaque février.","Je suis un agrume jaune et acide.","Les marins me consommaient contre le scorbut.","Mon jus empêche les fruits coupés de noircir.","On écrit à l'encre invisible avec mon jus.","Mon cousin vert est indispensable au mojito.","Je suis l'ingrédient d'une tarte meringuée.","Le limoncello italien est fait de mon zeste.","On me presse dans un presse-agrumes.","La côte amalfitaine est célèbre pour me cultiver.","Quand on réfléchit fort, on « se presse » comme moi.","Mon jus détartre et nettoie.","Ma version confite parfume les tajines marocains.","En anglais, mon nom désigne aussi une voiture d'occasion défectueuse.","Je fais grimacer quand on me croque.","Le poisson grillé m'appelle toujours.","Mon arbre peut fleurir plusieurs fois par an.","Une couleur jaune pâle porte mon nom.","Je suis riche en vitamine C.","Mon zeste parfume les pâtisseries."]},{"id":"c583","cat":"Chose","theme":"Chose","answer":"La glace","clues":["Mon cornet a été popularisé à l'Exposition universelle de Saint-Louis en 1904.","Je me sers en boules dans un cornet.","Je fonds vite au soleil.","Les Italiens m'appellent gelato.","Mangée trop vite, je provoque un mal de tête fulgurant.","Escoffier m'a associée à des pêches pour créer la pêche Melba.","Vanille, chocolat et fraise sont mes parfums classiques.","Ma cousine sans lait s'appelle le sorbet.","Aux États-Unis, un camion musical me vend dans les rues.","Mon nom désigne aussi l'eau gelée et un miroir.","Une boule de moi noyée dans un expresso, c'est l'affogato.","Nappée de chocolat chaud, je deviens une dame blanche.","Je suis la vedette du café liégeois.","On me lèche.","Je m'achète en bâtonnet ou en pot.","On me sert avec une cuillère à boule.","Une turbine me fait tourner pour incorporer de l'air.","Une sorbetière permet de me faire maison.","Chantilly et coulis me garnissent volontiers.","Je suis le dessert préféré des étés chauds."]},{"id":"c584","cat":"Chose","theme":"Chose","answer":"La choucroute","clues":["Krautergersheim se dit ma capitale.","Je suis une spécialité alsacienne.","Je suis faite d'un légume blanc émincé et fermenté.","Je fermente dans la saumure.","Saucisses de Strasbourg, lard et jarret me garnissent.","Les baies de genièvre me parfument.","Les Allemands m'appellent Sauerkraut.","Le capitaine Cook en emportait pour protéger ses marins du scorbut.","Ma version de la mer est garnie de poissons.","On m'accompagne d'une bière ou d'un riesling.","J'ai une IGP « d'Alsace ».","Les pommes de terre vapeur m'accompagnent.","Je suis meilleure réchauffée.","Je suis acidulée.","Mes filaments sont fins et blonds.","Pendant la Première Guerre mondiale, les Américains m'ont rebaptisée « liberty cabbage ».","Je suis servie sur un grand plat en brasserie.","La saucisse de Montbéliard peut me garnir.","Je suis un plat d'hiver très roboratif.","Le Kassler, une échine de porc fumée, accompagne volontiers ma garniture."]},{"id":"c585","cat":"Chose","theme":"Chose","answer":"Le pot-au-feu","clues":["Mon cousin italien est le bollito misto.","Je suis un plat de bœuf bouilli et de légumes.","L'os à moelle me régale, sur du pain grillé avec du gros sel.","Poireaux, carottes, navets et céleri me composent.","Mon bouillon peut se boire en entrée.","Gîte, macreuse et plat de côtes me composent.","Je mijote pendant des heures dans une grande marmite.","On m'accompagne de moutarde et de cornichons.","Un oignon piqué de clous de girofle me parfume.","Mes restes deviennent souvent un hachis Parmentier.","Le bouquet garni est indispensable à ma cuisson.","On écume la mousse grise à ma surface.","Pour un bouillon riche, ma viande part dans l'eau froide.","Je suis un plat familial du dimanche d'hiver.","Mon bouillon sert aussi à cuire des vermicelles.","Les pommes de terre cuisent à part pour ne pas troubler mon bouillon.","Je suis l'un des plats les plus anciens de la cuisine française.","On peut ajouter un chou à ma garniture.","Je suis un emblème de la cuisine française familiale.","Ma viande se détache à la fourchette après la cuisson."]},{"id":"c586","cat":"Chose","theme":"Chose","answer":"La quiche lorraine","clues":["Mon nom vient de l'allemand « Kuchen », gâteau.","Je suis une tarte salée.","Ma garniture : œufs, crème et lardons.","Ma recette authentique ne contient pas de fromage.","Je viens de l'est de la France.","Ma pâte est brisée.","On me sert en entrée ou avec une salade verte.","Je me mange chaude ou froide.","Mon mélange d'œufs et de crème s'appelle l'appareil.","Une pincée de muscade relève ma garniture.","Ma cousine picarde aux poireaux s'appelle la flamiche.","Mes lardons sont fumés.","On me cuit dans un moule à bord cannelé.","Je suis un classique des buffets et des pique-niques.","Nancy et Metz sont fières de moi.","Ma pâte se précuit « à blanc ».","On ajoute souvent du gruyère, au grand dam des puristes.","On me trouve en part chez le boulanger.","Je suis découpée en parts triangulaires.","Mon bord doit rester croustillant."]},{"id":"c587","cat":"Chose","theme":"Chose","answer":"Le bœuf bourguignon","clues":["Julia Child m'a fait découvrir aux Américains.","Je suis un ragoût de viande cuit au vin rouge.","Lardons, champignons et petits oignons me garnissent.","Je mijote plusieurs heures en cocotte.","Ma viande marine la veille dans le vin.","Dans le film Julie & Julia, je suis une recette fétiche.","Le paleron et la joue me conviennent.","Ma région natale produit du pinot noir.","Le coq au vin est mon cousin.","Je suis meilleur réchauffé.","Ma viande vient souvent de la race charolaise.","Mon cousin flamand cuit à la bière : la carbonade.","Dijon et Beaune sont dans ma région.","Je cuis à feu très doux, souvent au four.","On fait revenir ma viande avant de la mouiller.","Ma sauce est liée avec un peu de farine.","Carottes, ail et bouquet garni complètent ma recette.","On me sert avec des pâtes fraîches ou des pommes vapeur.","Je suis un plat d'hiver typique des brasseries.","Ma sauce est brune et très foncée."]},{"id":"c588","cat":"Chose","theme":"Chose","answer":"La tarte Tatin","clues":["Deux sœurs hôtelières de Lamotte-Beuvron m'ont rendue célèbre.","Je suis cuite à l'envers, la pâte au-dessus.","Mes pommes sont caramélisées.","Lamotte-Beuvron se trouve en Sologne.","Une légende raconte que je suis née d'une erreur.","On me retourne sur un plat à la sortie du four.","Une boule de vanille ou de la crème fraîche m'accompagne.","Je suis servie tiède.","Une confrérie veille sur ma recette.","Le beurre et le sucre forment mon caramel.","Mes créatrices s'appelaient Stéphanie et Caroline.","Leur hôtel existe toujours, face à la gare.","Le démoulage est mon moment délicat.","Je suis née vers la fin du XIXe siècle.","Ma pâte est brisée ou feuilletée.","Certaines variantes utilisent poires, coings ou tomates.","Les pommes reinettes me conviennent bien.","Mon moule doit aller sur le feu puis au four.","Je suis un dessert français célèbre à l'étranger.","Ma version salée aux échalotes existe aussi."]},{"id":"c589","cat":"Chose","theme":"Chose","answer":"Le riz","clues":["Les terrasses de Banaue, aux Philippines, me cultivent depuis 2 000 ans.","Je nourris plus de la moitié de l'humanité.","Je pousse souvent les pieds dans l'eau.","La Camargue me cultive en France.","Le basmati et le jasmin sont mes variétés parfumées.","La Chine est mon premier producteur.","On me lance sur les mariés à la sortie de la cérémonie.","Ma version gluante sert à faire les mochis.","Je suis la base des sushis.","Le saké japonais est fermenté à partir de moi.","Au lait, je fais un dessert de grand-mère.","L'arborio sert à un plat crémeux italien.","Ma version complète garde son enveloppe de son.","Mon grain non décortiqué s'appelle le paddy.","Je suis naturellement sans gluten.","En Asie, on me mange avec des baguettes.","Pour le pilaf, on me fait revenir avant de me cuire.","Cuit à la créole, je suis simplement bouilli à l'eau.","On met un téléphone mouillé dans un sachet de moi pour le sécher.","Soufflé, je deviens une galette légère et croustillante."]},{"id":"c590","cat":"Chose","theme":"Chose","answer":"Le lait","clues":["Ma bouteille demi-écrémée a souvent un bouchon bleu en France.","La vache m'en donne en abondance.","Pasteur a donné son nom à mon traitement thermique.","On me vend entier, demi-écrémé ou écrémé.","Je déborde de la casserole dès qu'on ne me surveille plus.","Les premières dents d'un enfant portent mon nom.","Je suis la base du fromage, du beurre et du yaourt.","Les mammifères en nourrissent leurs petits.","UHT signifie que j'ai été chauffé à ultra-haute température.","Une peau se forme à ma surface en refroidissant.","On dit que je fais de beaux os grâce au calcium.","Aux États-Unis, le Père Noël en reçoit un verre avec des biscuits.","On me tire à la traite, matin et soir.","L'Inde est mon premier producteur.","Fermenté, je donne le kéfir.","Les boissons d'avoine ou de soja tentent de me remplacer.","Mon goût change selon ce que mange la vache.","On me boit avec du cacao au petit-déjeuner.","Mon bouchon rouge signale ma version entière.","Je suis blanc."]},{"id":"c591","cat":"Chose","theme":"Chose","answer":"L'avocat","clues":["Mon nom vient du nahuatl « ahuacatl ».","Je viens du Mexique.","Je suis la base du guacamole.","Mon homonyme plaide au tribunal.","Mon noyau est énorme.","La Hass est ma variété la plus vendue.","Je suis un fruit, mais on me mange plutôt salé.","Je mûris après la cueillette.","Enfermé avec une pomme ou une banane, je mûris plus vite.","Je noircis à l'air, mais le citron me protège.","Je suis riche en bonnes graisses.","Ma culture demande beaucoup d'eau.","On me sert en entrée avec des crevettes.","Le Mexique est mon premier producteur.","Ma peau peut être lisse et verte ou granuleuse et noire.","Mon arbre peut dépasser 15 mètres de haut.","Mon noyau peut germer dans un verre d'eau, tenu par des cure-dents.","Je suis toxique pour certains animaux, comme les oiseaux.","Écrasé sur une tartine, je suis la star des brunchs.","On me tartine comme du beurre."]},{"id":"c592","cat":"Chose","theme":"Chose","answer":"Le pop-corn","clues":["Mes grains qui n'éclatent pas restent au fond du paquet.","Je suis du maïs éclaté.","On me mange au cinéma.","J'explose à la chaleur grâce à l'eau contenue dans mon grain.","Je peux être sucré ou salé.","Les peuples amérindiens me consommaient il y a des milliers d'années.","Pendant la Grande Dépression, je suis devenu un en-cas bon marché.","Mon grain éclate vers 180 °C.","Mon nom vient d'une onomatopée anglaise.","Je fais un bruit de petites détonations.","Seule une variété de maïs particulière me donne.","Aux États-Unis, on m'enfile en guirlande pour Noël.","On me prépare au micro-ondes, en sachet.","Au caramel, je suis une gourmandise de fête foraine.","On me sert dans un grand seau en carton.","Je suis un grain entier, donc une céréale complète.","Je suis léger, presque de l'air.","Au cinéma, le bruit qu'on fait en me mangeant agace parfois les voisins.","Une machine à cuve chauffée me prépare devant les salles.","On me partage devant un film à la maison."]},{"id":"c593","cat":"Chose","theme":"Chose","answer":"La mayonnaise","clues":["Mon nom évoquerait Port-Mahon, à Minorque.","Je suis une émulsion d'huile et de jaune d'œuf.","Je peux « tourner » ou « monter ».","Quand une ambiance réussit, on dit que je « prends ».","Moutarde et vinaigre peuvent me composer.","Les Belges m'adorent avec les frites.","Avec un œuf dur, je forme une entrée de bistrot.","La rémoulade et la sauce tartare dérivent de moi.","Avec du ketchup, je deviens la sauce cocktail.","Mes ingrédients doivent être à la même température.","On me fouette énergiquement.","Je suis vendue en tube ou en pot.","Je suis une sauce froide.","Je suis jaune pâle et épaisse.","Une légende lie ma naissance au duc de Richelieu en 1756.","Je suis très calorique.","Je relève les sandwichs au thon.","Les Japonais ont leur version au vinaigre de riz.","Je suis l'une des grandes sauces froides de la cuisine française.","Montée à l'ail, je ressemble à l'aïoli."]},{"id":"c594","cat":"Chose","theme":"Chose","answer":"Le vin","clues":["La Géorgie revendique ma plus ancienne production, il y a 8 000 ans.","Je suis issu du raisin fermenté.","Je peux être rouge, blanc ou rosé.","Bacchus et Dionysos sont mes dieux.","Le sommelier me goûte avant de me servir.","Je vieillis parfois en fût de chêne.","Le phylloxéra a ravagé mes vignes à la fin du XIXe siècle.","Pasteur a étudié ma fermentation.","On fait tourner mon verre pour m'aérer.","Mes « larmes » coulent sur les parois du verre.","Aux noces de Cana, l'eau aurait été changée en moi.","L'œnologue étudie ma fabrication.","Les vendanges ont lieu en septembre et octobre.","On me décante en carafe.","Mon beaujolais nouveau arrive le troisième jeudi de novembre.","Mon bouchon de liège se retire avec un tire-bouchon.","L'Italie, la France et l'Espagne sont mes premiers producteurs.","Une expression dit qu'une fois tiré, il faut me boire.","Le Bordelais et la Bourgogne me rendent célèbre.","On me sert volontiers avec le fromage."]},{"id":"c595","cat":"Chose","theme":"Chose","answer":"La bière","clues":["Une loi allemande de pureté fixe ma recette depuis 1516.","Je suis faite d'orge malté, de houblon, d'eau et de levure.","Le houblon me donne mon amertume.","Ma mousse forme un faux col.","Des moines trappistes me brassent en Belgique.","Ma culture belge est inscrite à l'UNESCO depuis 2016.","L'Oktoberfest de Munich me célèbre.","Les Sumériens me buvaient déjà.","Je peux être blonde, brune, ambrée ou blanche.","On me sert à la pression.","Un demi désigne un verre de 25 centilitres de moi.","Ma version IPA est très houblonnée.","Homer Simpson m'adore.","Les bâtisseurs des pyramides recevaient des rations de moi.","La Tchéquie me consomme le plus par habitant.","Mélangée à de la limonade, je deviens un panaché.","Pour la Saint-Patrick, on me sert parfois verte.","Je suis la boisson alcoolisée la plus bue au monde.","Le malt, c'est de l'orge germée puis séchée.","Le nombre de petites brasseries a explosé en France."]},{"id":"c596","cat":"Chose","theme":"Chose","answer":"Les huîtres","clues":["Nos tailles vont du 0 au 5, le 0 étant le plus gros.","On nous ouvre au couteau.","Nous sommes des mollusques bivalves.","Cancale, Arcachon et Marennes-Oléron nous élèvent.","Notre élevage s'appelle l'ostréiculture.","On disait de nous manger seulement les mois en « r ».","Nous pouvons produire des perles.","Nous pouvons changer de sexe au cours de notre vie.","Nous filtrons plusieurs litres d'eau par heure.","On nous sert sur un plateau de fruits de mer, sur de la glace.","Le vinaigre à l'échalote et le citron nous accompagnent.","On nous mange vivantes.","Il existe des creuses et des plates.","Notre version plate de Bretagne s'appelle la belon.","Nous sommes un classique du réveillon.","Les Romains nous élevaient déjà.","Un muscadet ou un chablis nous accompagne.","Nos fines de claire sont affinées dans des bassins.","Notre couteau a une garde pour protéger la main.","Nos « spéciales » sont plus charnues."]},{"id":"c597","cat":"Chose","theme":"Chose","answer":"Le tiramisu","clues":["Mon nom signifie « tire-moi vers le haut ».","Je viens d'Italie.","Mascarpone, café, biscuits et cacao me composent.","Trévise, en Vénétie, revendique ma création.","Le Frioul me revendique aussi.","On trempe les biscuits à la cuillère dans le café.","On me saupoudre de cacao amer.","Je repose une nuit au réfrigérateur.","Je ne passe pas au four.","Un trait d'amaretto ou de marsala peut me parfumer.","Mes couches alternent biscuits et crème.","Des œufs crus entrent dans ma crème.","Je me sers en verrine ou au plat.","Je suis l'un des desserts italiens les plus commandés.","Un restaurant de Trévise, Le Beccherie, est souvent cité comme mon berceau.","Mes biscuits s'appellent savoiardi en Italie.","Je suis apparu dans les années 1960-1970.","Je me coupe en carrés.","Ma version aux fruits rouges ou aux spéculoos est à la mode.","Je suis frais et crémeux."]},{"id":"c598","cat":"Chose","theme":"Chose","answer":"Le hot-dog","clues":["Coney Island, à New York, est célèbre pour moi.","Je suis une saucisse dans un petit pain long.","Je suis né aux États-Unis, grâce à des immigrés allemands.","Un concours de mangeurs a lieu chaque 4 juillet à Coney Island.","Ketchup, moutarde et oignons frits me garnissent.","On me vend dans les stades de baseball.","Ma saucisse de Francfort ou de Strasbourg me garnit.","En France, ma version gratinée se vend en boulangerie.","Les Danois me vendent dans des kiosques de rue.","On me vend dans des chariots à New York.","Une sauce aux cornichons sucrés, la relish, me garnit.","À Chicago, le ketchup est banni de ma version locale.","Je suis un roi du fast-food américain.","Je me mange avec les mains, en quelques bouchées.","Ma saucisse est pochée ou grillée.","Mon pain est fendu sur le dessus ou sur le côté.","Ma saucisse évoquait pour certains la silhouette d'un teckel.","Le 4 juillet, des millions de moi sont grillés aux États-Unis.","J'existe aussi en version végétarienne.","On me trouve dans les fêtes foraines."]},{"id":"c599","cat":"Chose","theme":"Chose","answer":"La moutarde","clues":["Le colonel du Cluedo porte mon nom.","Dijon est ma capitale.","Je suis faite de graines broyées avec du vinaigre ou du verjus.","Mes graines sont surtout importées du Canada.","Quand on s'énerve, je « monte au nez ».","Je pique le nez.","Ma version à l'ancienne garde les graines entières.","Meaux est célèbre pour sa version à l'ancienne.","J'accompagne le pot-au-feu et les saucisses.","« De Dijon » désigne une recette, pas forcément mon lieu de fabrication.","Un gaz de combat de la Première Guerre mondiale porte mon nom.","Ma version de Bourgogne a une IGP depuis 2009.","Je suis un ingrédient de la vinaigrette.","Les fleurs de ma plante colorent les champs en jaune.","Les Américains me mettent, douce et jaune, sur leurs hot-dogs.","Le pot en grès était mon emballage traditionnel.","On me parfume au miel, à l'estragon ou au cassis.","En 2022, j'ai manqué dans les rayons après une sécheresse au Canada.","Les feuilles de ma plante se mangent en Asie.","J'en fais pleurer certains quand ils en prennent trop."]},{"id":"c600","cat":"Chose","theme":"Chose","answer":"Le croque-monsieur","clues":["Proust me cite dans À la recherche du temps perdu.","Je suis un sandwich chaud au jambon et au fromage.","Je suis fait de pain de mie.","Avec un œuf au plat sur le dessus, je change de genre.","Je suis apparu dans un café parisien vers 1910.","La béchamel me nappe dans ma version gratinée.","On me fait dans un appareil à empreintes.","Le gruyère ou l'emmental me gratine.","Je suis un classique des brasseries et des cafés.","Je suis le dîner rapide des étudiants.","On me fait dorer au beurre dans la poêle.","Le panini italien est mon cousin.","Le Monte-Cristo américain est mon cousin frit.","Le jambon blanc est mon ingrédient central.","On me sert avec une salade verte.","On me coupe en deux triangles.","Quelques minutes au four me suffisent.","Ma version hawaïenne ajoute de l'ananas.","Les enfants m'adorent.","Je suis croustillant dehors et fondant dedans."]},{"id":"s1","cat":"Chose","theme":"Chose","answer":"L'arc-en-ciel","clues":["Pour me voir, il faut tourner le dos au soleil.","Dans la mythologie grecque, la messagère Iris me personnifie.","Mon rouge est à l'extérieur, mon violet à l'intérieur.","Une légende irlandaise cache un chaudron d'or à mon pied.","J'apparais souvent quand le soleil perce après une averse.","Vu d'avion, je peux former un cercle complet.","Un second, plus pâle et aux couleurs inversées, m'accompagne parfois.","Je recule à mesure qu'on avance : impossible de m'atteindre.","Dans la Bible, je suis le signe de l'alliance après le Déluge.","Rouge, orange, jaune, vert, bleu, indigo, violet : ce sont mes couleurs.","On peut me créer avec un tuyau d'arrosage par beau temps.","Je nais de la lumière réfractée et réfléchie dans des gouttes d'eau.","Newton a étudié la décomposition de la lumière qui me forme.","Mon centre est toujours à l'opposé exact du soleil.","Un drapeau à mes couleurs symbolise la fierté LGBT.","Les embruns des cascades m'offrent souvent un décor.","Je suis plus fréquent le matin ou en fin d'après-midi.","Je ne suis pas un objet : je n'existe que dans l'œil de celui qui regarde.","Dans « Le Magicien d'Oz », Dorothy rêve d'un pays au-delà de moi.","On compte traditionnellement sept couleurs en moi."]},{"id":"s2","cat":"Chose","theme":"Chose","answer":"L'éclair","clues":["Je peux chauffer l'air à environ 30 000 °C.","Un gâteau allongé au chocolat ou au café porte mon nom.","Benjamin Franklin m'a étudié avec un cerf-volant.","Je dure en général moins d'une seconde.","On me voit avant d'entendre le tonnerre.","Le paratonnerre a été inventé pour me capter.","Je nais le plus souvent dans les cumulonimbus.","Zeus me lançait sur ceux qui le défiaient.","On dit que je ne frappe jamais deux fois au même endroit, c'est faux.","Compter les secondes après moi, divisé par trois, donne la distance en km.","Harry Potter porte ma forme en cicatrice sur le front.","Je jaillis environ 40 fois par seconde quelque part sur Terre.","En voiture, la carrosserie protège de moi comme une cage de Faraday.","En frappant le sable, je peux créer des tubes de verre, les fulgurites.","Usain Bolt imitait mon geste pour célébrer ses victoires.","Je zèbre le ciel pendant les orages.","Je suis une gigantesque décharge électrique.","Je peux frapper à plus de dix kilomètres de l'orage qui m'a vu naître.","Ma forme en zigzag orne les panneaux de danger électrique.","Rapide comme moi : on ne peut pas faire plus vite."]},{"id":"s3","cat":"Chose","theme":"Chose","answer":"La neige","clues":["Mes cristaux ont en général six branches.","Je suis en réalité translucide : c'est la lumière diffusée qui me blanchit.","Les canons peuvent me fabriquer artificiellement.","Elsa, dans un célèbre film Disney, me fait apparaître d'un geste.","Je tombe du ciel en flocons.","Les avalanches sont faites de moi.","On dit que deux de mes flocons ne sont jamais identiques.","Les raquettes permettent de marcher sur moi sans s'enfoncer.","Les skieurs m'attendent avec impatience chaque hiver.","Je semble étouffer les sons : tout paraît plus calme quand je tombe.","On répand du sel sur les routes quand je tombe.","Sans lunettes de soleil, mon éclat peut brûler les yeux en montagne.","Les igloos sont construits avec mes blocs.","On me dit poudreuse, fraîche, ou de printemps.","Je recouvre certains sommets toute l'année.","Je fonds au soleil.","Je tombe quand l'air est proche de 0 °C ou en dessous.","Les enfants me roulent en boules pour se les lancer.","Avec moi, on fait des bonhommes au nez en carotte.","On rêve de me voir tomber le soir de Noël."]},{"id":"s4","cat":"Chose","theme":"Chose","answer":"La tornade","clues":["Dans « Le Magicien d'Oz », j'emporte Dorothy et sa maison.","On me classe sur l'échelle de Fujita améliorée, de EF0 à EF5.","Je suis une colonne d'air qui tourne violemment.","Les États-Unis en connaissent plus d'un millier chaque année.","Sur l'eau, on m'appelle trombe marine.","Je relie la base d'un orage au sol.","Le film « Twister » suit des scientifiques qui me traquent.","Mes vents peuvent dépasser 300 km/h.","Je ne dure souvent que quelques minutes.","Les chasseurs d'orages me poursuivent en voiture.","Je ressemble à un entonnoir sombre descendant du ciel.","La France en connaît aussi, plusieurs dizaines par an.","Les orages de type supercellule sont ceux qui m'engendrent le plus.","Je peux soulever des voitures et arracher des toits.","Mon diamètre va de quelques mètres à plus d'un kilomètre.","Aux États-Unis, les Grandes Plaines sont surnommées mon « couloir ».","Dans l'hémisphère Nord, je tourne surtout dans le sens antihoraire.","On se réfugie à la cave quand j'approche.","Je suis plus petite qu'un ouragan, mais mes vents peuvent être plus forts.","Le tourbillon de poussière du désert est mon petit cousin."]},{"id":"s5","cat":"Chose","theme":"Chose","answer":"L'aurore boréale","clues":["Les Finlandais m'appellent les « feux du renard ».","Je danse dans le ciel nocturne près du pôle Nord.","Mon vert vient de l'oxygène de l'atmosphère.","En mai 2024, une tempête solaire m'a rendue visible jusqu'en France.","Le vent solaire est à mon origine.","Ma jumelle de l'hémisphère Sud est dite australe.","Je brille à plus de 100 km d'altitude.","On vient en Laponie ou en Islande pour m'admirer.","Le champ magnétique terrestre guide les particules qui me font naître.","Je suis plus fréquente lors des pics d'activité solaire, tous les onze ans.","Mon nom associe l'aube romaine et le dieu grec du vent du Nord.","On me photographie avec un temps de pose long.","Je ressemble à des rideaux de lumière ondulants.","Les astronautes de la Station spatiale me voient d'en haut.","Ma teinte rouge, plus rare, apparaît en très haute altitude.","Tromsø, en Norvège, est réputée pour mes apparitions.","Je suis plus visible pendant les longues nuits d'hiver.","Le Canada et l'Alaska m'offrent aussi de belles nuits.","Je suis souvent verte, parfois rose ou violette.","Des particules venues du Soleil excitent les atomes de l'air pour me créer."]},{"id":"s6","cat":"Chose","theme":"Chose","answer":"L'éclipse solaire","clues":["Tintin se sert de moi pour impressionner les Incas.","La Lune se place alors entre la Terre et le Soleil.","Je ne peux me produire qu'à la nouvelle lune.","En France, ma dernière version totale date du 11 août 1999.","Il ne faut jamais me regarder sans lunettes spéciales.","Totale, je laisse voir la couronne du Soleil.","Le 12 août 2026, j'ai été totale en Espagne.","Je peux être partielle, annulaire ou totale.","Ma phase totale dure au maximum environ sept minutes et demie.","En 1919, j'ai permis de confirmer la relativité d'Einstein.","L'effet « bague de diamant » apparaît juste avant ma totalité.","Annulaire, je laisse un anneau de feu autour de la Lune.","Je plonge le jour dans une nuit étrange pendant quelques minutes.","Les oiseaux se taisent souvent quand je surviens.","Ma zone de totalité est une bande étroite sur la Terre.","La température baisse de quelques degrés pendant ma totalité.","Les Babyloniens prédisaient mon retour grâce au cycle de Saros.","Je me produis entre deux et cinq fois par an quelque part sur Terre.","Ma cousine lunaire a lieu quand la Terre fait de l'ombre à la Lune.","Les anciens me voyaient souvent comme un mauvais présage."]},{"id":"s7","cat":"Chose","theme":"Chose","answer":"Le volcan","clues":["La pierre ponce, si légère qu'elle flotte, vient de moi.","Je crache de la lave.","En 79, l'un des miens a enseveli Pompéi.","Olympus Mons, le plus haut du système solaire, est sur Mars.","La chaîne des Puys, en Auvergne, en aligne des dizaines.","Je peux être actif, endormi ou éteint.","Haroun Tazieff m'a consacré sa vie.","Le dieu romain Vulcain m'a donné son nom.","En 2010, l'un des miens en Islande a paralysé le trafic aérien européen.","Le Piton de la Fournaise, à La Réunion, est l'un des plus actifs.","La « ceinture de feu » du Pacifique m'abrite par centaines.","Mes cendres rendent les sols très fertiles.","L'Etna est le plus haut d'Europe en activité.","Le Krakatoa a explosé en 1883 avec un fracas entendu à des milliers de km.","Je peux naître au fond de l'océan et former des îles, comme Hawaï.","La montagne Pelée a détruit Saint-Pierre, en Martinique, en 1902.","Mon cratère est souvent au sommet.","Mes nuées ardentes dévalent les pentes à toute vitesse.","Le basalte est une roche que je produis.","Mon magma vient des profondeurs de la Terre."]},{"id":"s8","cat":"Chose","theme":"Chose","answer":"La rose","clues":["Le Petit Prince me protège sous un globe.","Mon fruit est le cynorrhodon, surnommé gratte-cul.","On m'offre à la Saint-Valentin.","Une guerre anglaise du XVe siècle porte mon nom.","L'impératrice Joséphine m'a collectionnée à la Malmaison.","Je suis surnommée la reine des fleurs.","Aucune de mes variétés n'est naturellement bleue.","Le Parti socialiste m'a pour emblème, tenue dans un poing.","Grasse, en Provence, me cultive pour la parfumerie.","Ronsard m'a comparée à la beauté éphémère d'une jeune femme.","Mon eau parfumée sert dans les pâtisseries orientales.","Quand on est optimiste, on voit la vie de ma couleur.","Umberto Eco m'a placée dans le titre de son célèbre roman.","Je suis l'emblème floral de l'Angleterre.","Le pommier et le fraisier sont de ma famille botanique.","Dans « La Belle et la Bête » de Disney, tout se joue avant la chute de mon dernier pétale.","Rouge, je symbolise l'amour passionné.","On dit que je pique, à cause de mes épines.","Je pousse sur un arbuste qu'on taille à la fin de l'hiver.","Mon parfum est l'un des plus utilisés en parfumerie."]},{"id":"s9","cat":"Chose","theme":"Chose","answer":"Le tournesol","clues":["Mes graines s'organisent en spirales liées à la suite de Fibonacci.","Le savant distrait de Tintin porte mon nom.","Je suis une grande fleur jaune.","Van Gogh m'a peint plusieurs fois dans un vase.","Jeune, ma tête suit le soleil d'est en ouest.","Je viens d'Amérique du Nord.","On extrait de mes graines une huile de cuisine.","Je peux dépasser trois mètres de haut.","Mon cœur est en fait composé de centaines de petites fleurs.","L'Ukraine est l'un de mes premiers producteurs mondiaux.","On m'appelle aussi grand soleil ou hélianthe.","Mes champs colorent le Sud-Ouest de la France en été.","Une fois mûr, je ne bouge plus et je regarde vers l'est.","Les hamsters adorent mes graines.","J'appartiens à la même famille que la marguerite.","Mon huile est riche en vitamine E.","Après Tchernobyl, on m'a planté pour absorber des polluants.","On me récolte à la fin de l'été.","Les abeilles butinent mon large disque.","Je suis un symbole de l'Ukraine."]},{"id":"s10","cat":"Chose","theme":"Chose","answer":"Le chêne","clues":["Saint Louis rendait la justice sous moi à Vincennes.","Je donne des glands.","Mes feuilles ornent le képi des généraux français.","La Fontaine m'a opposé au roseau dans une fable.","Mon bois sert à fabriquer les tonneaux de vin.","Les druides cueillaient le gui sur moi.","Je peux vivre plusieurs siècles.","Les truffes poussent souvent à mon pied.","Le liège est l'écorce de l'un de mes cousins.","Dans la Grèce antique, j'étais l'arbre de Zeus.","Les Romains offraient une couronne de mes feuilles aux sauveurs de citoyens.","Mon bois a longtemps servi à construire les navires de guerre.","La forêt de Tronçais, voulue par Colbert, m'abrite pour la marine.","On dit d'un homme robuste qu'il est solide comme moi.","Mes feuilles sont découpées en lobes arrondis.","Le geai et l'écureuil me plantent en oubliant mes fruits.","Je suis l'arbre national de l'Allemagne.","Pédonculé ou sessile, je suis très répandu en France.","Mes feuilles mortes restent parfois accrochées tout l'hiver.","Je pousse lentement : mon bois est dur et dense."]},{"id":"s11","cat":"Chose","theme":"Chose","answer":"Le cactus","clues":["Je figure sur le drapeau du Mexique, sous l'aigle.","J'ai des épines à la place des feuilles.","Le saguaro, l'un des miens, peut dépasser douze mètres.","Je stocke de l'eau dans ma tige.","La tequila ne vient pas de moi, mais de l'agave.","Je viens presque exclusivement d'Amérique.","On dit « il y a un » moi pour signaler un problème.","Le figuier de Barbarie est des miens ; ses fruits se mangent.","Ma silhouette en candélabre évoque les westerns.","Le peyotl est un de mes cousins.","Je pousse dans le désert.","On m'arrose très peu.","Au Mexique, on mange mes raquettes sous le nom de nopales.","Mes fleurs sont parfois spectaculaires mais éphémères.","Ma tige verte assure la photosynthèse.","On me range parmi les plantes grasses.","Mon épiderme cireux limite l'évaporation.","Je peux survivre des mois sans pluie.","Certains de mes membres vivent plus de cent ans.","Je décore souvent les bureaux et les rebords de fenêtre."]},{"id":"s12","cat":"Chose","theme":"Chose","answer":"Le coquelicot","clues":["Les Britanniques me portent à la boutonnière en novembre.","Je suis une fleur rouge des champs.","Mes pétales sont fins comme du papier froissé.","Mon nom imiterait le chant du coq.","Je suis de la famille du pavot.","Monet m'a peint dans un champ près d'Argenteuil.","Mes graines restent viables des dizaines d'années dans le sol.","Nemours fabrique des bonbons à mon arôme.","Mon cœur est noir.","Le poème « In Flanders Fields » m'a rendu célèbre.","Je suis devenu le symbole des soldats tombés pendant la Grande Guerre.","On rougit parfois « comme » moi.","Je fane très vite une fois cueilli.","Mon bouton poilu reste penché avant de s'ouvrir.","Je fleuris en mai et juin.","Je pousse au bord des routes et dans les blés.","Les herbicides m'ont raréfié dans les cultures.","En tisane, on m'utilise traditionnellement pour aider à dormir.","Dans « Le Magicien d'Oz », un champ de mes semblables endort Dorothy.","Je suis une plante annuelle."]},{"id":"s13","cat":"Chose","theme":"Chose","answer":"Le muguet","clues":["Le pays nantais produit l'essentiel de mes brins vendus en France.","On m'offre le 1er mai.","Je porte bonheur.","Selon la tradition, Charles IX m'offrait aux dames de la cour.","Mes clochettes blanches sentent très bon.","Je suis toxique : attention aux enfants et aux animaux.","Christian Dior adorait ma fleur et en a fait son porte-bonheur.","Mes feuilles ressemblent à celles de l'ail des ours.","On me surnomme le lys des vallées.","Mes baies sont rouges.","Je pousse dans les sous-bois.","Je suis la fleur nationale de la Finlande.","Mon parfum est si dur à extraire qu'on le recrée chimiquement.","La vente de mes brins dans la rue est tolérée le 1er mai.","Mes fleurs pendent le long d'une tige arquée.","Je contiens des substances qui agissent sur le cœur.","Je suis associé à la fête du Travail.","Je fleuris au printemps, vers avril et mai.","On me vend en brins ou en pots.","On peut me cueillir en forêt, en petite quantité."]},{"id":"s14","cat":"Chose","theme":"Chose","answer":"Le bambou","clues":["Le panda me mange presque exclusivement.","Certaines de mes espèces poussent de près d'un mètre par jour.","Je suis en réalité une herbe géante.","Edison a utilisé mes fibres carbonisées comme filament d'ampoule.","Ma tige creuse est segmentée par des nœuds.","En Asie, on fait des échafaudages avec moi.","Mes jeunes pousses se mangent.","Certaines de mes espèces ne fleurissent qu'une fois tous les 60 à 120 ans.","Mes rhizomes envahissants peuvent coloniser tout un jardin.","On fabrique avec moi des baguettes, des meubles et du textile.","Les sabres d'entraînement du kendo sont faits de mes lamelles.","Ma floraison massive peut provoquer des invasions de rats en Inde.","Dans le Gard, près d'Anduze, une célèbre forêt de moi se visite.","Je suis un symbole de souplesse et de résistance en Asie.","Je ne suis pas un arbre, malgré ma taille.","Je suis l'une des plantes à la croissance la plus rapide au monde.","On fait du papier avec mes fibres en Chine.","Les flûtes de Pan sont parfois taillées en moi.","On fabrique des parquets avec moi.","Je suis souvent présenté comme un matériau écologique."]},{"id":"s15","cat":"Chose","theme":"Chose","answer":"La carotte","clues":["L'enseigne des bureaux de tabac porte mon nom.","Je suis un légume racine orange.","On dit que je rends aimable.","Mes ancêtres étaient violets ou jaunes.","Quand je suis cuite, tout est perdu.","En 1940, les Britanniques ont fait croire que je donnais la vision nocturne.","Je sers de nez au bonhomme de neige.","La politique du bâton et de moi alterne menace et récompense.","Je suis la cousine du panais et du céleri.","Râpée, je suis une entrée classique.","Le potage Crécy est fait de moi.","Bugs Bunny me croque en demandant ce qui se passe.","Je pousse sous terre.","Mes fanes vertes peuvent se cuisiner en soupe.","Les chevaux m'adorent en friandise.","Mon gâteau est un classique anglo-saxon.","Mon jus est une boisson réputée saine.","On dit que je donne bonne mine.","Je suis riche en provitamine A.","On me met dans le pot-au-feu."]},{"id":"s16","cat":"Chose","theme":"Chose","answer":"L'œuf","clues":["Fabergé a créé des joyaux à ma forme pour les tsars.","On me mange à la coque, au plat ou brouillé.","Qui de moi ou de la poule est apparu en premier ?","Un code imprimé sur moi indique le mode d'élevage, de 0 à 3.","Si je flotte dans l'eau, je ne suis plus très frais.","Mon jaune s'appelle aussi le vitellus.","Les cloches de Pâques m'apportent en chocolat.","Ma coquille est faite de calcaire.","Avancer avec précaution, c'est marcher sur moi.","Monté en neige, mon blanc donne les meringues.","Une anecdote célèbre prête à Christophe Colomb un défi pour me faire tenir debout.","Il ne faut pas mettre tous mes semblables dans le même panier.","Couvé, j'éclos au bout d'environ 21 jours chez la poule.","Avec de l'huile, je suis la base de la mayonnaise.","Humpty Dumpty, dans les comptines anglaises, en est un.","L'autruche pond le plus gros de tous.","Mon blanc s'appelle l'albumen.","Dur, je cuis environ dix minutes.","Je suis une source de protéines bon marché.","Je viens souvent de la poule."]},{"id":"s17","cat":"Chose","theme":"Chose","answer":"L'ananas","clues":["Bob l'éponge vit dans une maison à ma forme.","Ma couronne de feuilles est piquante.","Christophe Colomb m'a découvert en Guadeloupe en 1493.","Je pousse au ras du sol, pas sur un arbre.","Mon enzyme, la bromélaïne, attendrit la viande.","Je fais picoter la langue.","Ma présence sur la pizza hawaïenne divise le monde.","Au XVIIIe siècle, j'étais un symbole de luxe en Europe.","On peut me replanter à partir de ma couronne.","Je suis un fruit composé de nombreuses baies soudées.","La variété Victoria est cultivée à La Réunion.","Les Anglais m'appellent « pomme de pin ».","Je viens d'Amérique du Sud.","Mon nom vient de la langue tupi.","Je mets un an et demi à deux ans à pousser.","Hawaï a longtemps été mon premier producteur mondial.","Le Costa Rica est aujourd'hui mon premier exportateur.","Mon enzyme empêche la gélatine de prendre.","Mon écorce est couverte d'écailles disposées en spirales.","On me vend en tranches au sirop, en boîte."]},{"id":"s18","cat":"Chose","theme":"Chose","answer":"La noix de coco","clues":["J'ai trois « yeux » à une extrémité.","Je tombe des palmiers.","Mon eau est une boisson rafraîchissante.","Ma chair séchée s'appelle le coprah.","Je peux flotter et traverser les océans.","Les Monty Python imitent le galop des chevaux avec mes coques.","Mon lait parfume les currys.","Botaniquement, je suis une drupe.","Râpée, je décore les gâteaux et les rochers.","Les fibres de ma coque font des paillassons.","L'arbre qui me porte peut dépasser 25 mètres.","La piña colada mêle mon lait, l'ananas et le rhum.","Mon huile se solidifie au frais.","On m'ouvre souvent à la machette.","Je suis brune et poilue à l'extérieur.","Ma chair est blanche.","Les const SFX=(()=>{let ctx=null,noise=null;
  function ac(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();const len=Math.floor(ctx.sampleRate*.6);noise=ctx.createBuffer(1,len,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
    if(ctx.state==="suspended")ctx.resume();return ctx}
  function nz(dur,type,f0,f1,vol,q){const c=ac();if(!c)return;const t=c.currentTime;const s=c.createBufferSource();s.buffer=noise;const f=c.createBiquadFilter();f.type=type;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t,Math.random()*.3);s.stop(t+dur+.03)}
  function tone(freq,at,dur,vol,type){const c=ac();if(!c)return;const t=c.currentTime+at;const o=c.createOscillator();o.type=type||"sine";o.frequency.setValueAtTime(freq,t);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03)}
  const P={
    unlock(){ac()},
    deal(){nz(.26,"bandpass",700,2400,.16,.7)},
    peel(){nz(.1,"highpass",2200,5200,.07)},
    flip(){nz(.18,"bandpass",2200,700,.12,.8)},
    tick(){nz(.025,"highpass",3200,3400,.03,.5)},
    ok(){[523.25,659.25,783.99].forEach((f,i)=>{tone(f,i*.09,.55,.13,"triangle");tone(f*2,i*.09,.22,.03)})},
    ko(){tone(220,0,.3,.12,"triangle");tone(164.8,.13,.42,.11,"triangle")},
    stamp(){tone(92,0,.2,.28);nz(.09,"lowpass",1100,300,.16)},
    win(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.13,.8,.12,"triangle"));tone(1318.5,.55,1,.05)},
    soft(){tone(660,0,.09,.05)}
  };
  return new Proxy({},{get:(_,k)=>()=>{if(!S.sound)return;try{P[k]&&P[k]()}catch(e){}}});
})();

function confetti(big){if(REDUCE)return;const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);const cols=["--red","--blue","--yellow","--navy","--ok","--paper"].map(v=>cs.getPropertyValue(v).trim()||"#d24a3f");const N=big?170:90;const P=[];
  for(let i=0;i<N;i++){const side=big?(i%2?1:-1):0;const ox=big?(side<0?-10:W+10):W/2;const oy=big?H*.75:H*.62;
    const ang=big?(side<0?-Math.PI/3:-2*Math.PI/3)+(Math.random()-.5)*.7:-Math.PI/2+(Math.random()-.5)*1.5;const sp=(big?11:9)+Math.random()*7;
    P.push({x:ox,y:oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,w:6+Math.random()*6,h:9+Math.random()*8,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,ph:Math.random()*6.3,c:cols[i%cols.length]})}
  const t0=performance.now(),dur=big?4200:2600;let last=t0;
  (function fr(now){const dt=Math.min(2,(now-last)/16.7);last=now;x.clearRect(0,0,W,H);let alive=0;
    for(const p of P){p.vy+=.32*dt;p.vx*=Math.pow(.985,dt);p.vy*=Math.pow(.985,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.ph+=.18*dt;if(p.y<H+30)alive++;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.ph));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(alive&&now-t0<dur)requestAnimationFrame(fr);else cv.remove()})(t0);
}

 </div></div>`}

  S.game={players,scores:players.map(()=>0),round:0,target,cards,reader:0,guesser:1%players.length,used:[],showAnswer:false,result:null,tokens:players.map(()=>!!S.useTokens)};
  S.jokerAsk=null;S.clueOpen=null;S.hist=[];S.adjust=false;save();S.view="round";render();window.scrollTo(0,0);
}

  if(found){S.clueOpen=null;const pts=20-n;g.scores[i]+=pts;g.scores[g.reader]+=n;g.result={found:true,who:i,pts,readerPts:n,joker:true}}

}
