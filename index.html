function judge(found){
  snap();const g=S.game,n=g.used.length;S.clueOpen=null;
  if(found){const pts=20-n;g.scores[g.guesser]+=pts;g.scores[g.reader]+=n;g.result={found:true,who:g.guesser,pts,readerPts:n}}
  else if(n>=20){g.scores[g.reader]+=20;g.result={found:false,readerPts:20}}
  else{nextGuesser();SFX.ko()}
  render();
}
function nextRound(){
  snap();const g=S.game;g.round++;
  if(Math.max(...g.scores)>=g.target){S.view="final";render();window.scrollTo(0,0);return}
  g.reader=g.round%g.players.length;g.guesser=(g.reader+1)%g.players.length;g.used=[];g.result=null;g.showAnswer=false;g.showAll=false;render();
}

  const a=document.getElementById("app");
  applyStyle();a.classList.toggle("is-home",S.view==="home");
  a.innerHTML=({home,setup,round,final,cards,editor,rules,browse,styles})[S.view]();
  bind();after();
}

function board(used,attr,locked){return `<div class="sheetboard"><div class="board">${Array.from({length:20},(_,i)=>i+1).map(k=>`<button class="n ${used.includes(k)?"used":""}" style="--r:${rot(k)}deg" ${attr}="${k}" ${used.includes(k)||locked?"disabled":""} aria-label="Indice ${k}${used.includes(k)?", déjà lu":""}">${k}</button>`).join("")}</div></div>`}

function ansRow(c,shown,attr){return `<div class="ansrow"><span class="ans ${shown?"":"hid"}" aria-live="polite">${shown?esc(c.answer):"• • • • •"}</span><button class="small" ${attr} aria-pressed="${shown}">${shown?"Masquer":"Afficher"} la réponse</button></div>`}
function strip(){const g=S.game;return `<div class="strip" aria-label="Scores">${g.players.map((p,i)=>`<div class="pl ${i===g.reader?"reader":""} ${i===g.guesser&&!g.result?"turnp":""}"><span class="pn">${esc(p)}</span><b>${g.scores[i]}</b><small>${i===g.reader?"lecteur":i===g.guesser&&!g.result?"son tour":"&nbsp;"}</small>${g.tokens&&g.tokens[i]?`<i class="tok" title="Jeton disponible"></i>`:""}</div>`).join("")}</div>`}

function round(){
  const g=S.game,c=card(),n=g.used.length;
  let top;
  if(g.result){const r=g.result,d={};if(r.found){d[r.who]=r.pts}d[g.reader]=(d[g.reader]||0)+r.readerPts;
    top=`<section class="gcard res">
     <header class="band"><span class="catname">${esc(c.cat)}</span><span class="cno">Carte ${g.round+1}</span></header>
     <div class="gbody">

      <p class="label">La réponse</p>
      <p class="answer">${esc(c.answer)}</p>
      <p class="summary">${r.found?`<b>${esc(g.players[r.who])}</b> trouve${r.joker?" avec son jeton":""} après ${n} indice${n>1?"s":""}.`:`Personne n'a trouvé : le lecteur <b>${esc(g.players[g.reader])}</b> prend les 20 points.`}</p>
     </div></section>
     <div class="panel">${scoreList(d)}</div>
     ${n<20?`<button class="block" data-showall aria-pressed="${!!g.showAll}">${g.showAll?"Masquer les indices non lus":"Afficher tous les indices"}</button>`:""}
     <button class="primary block big" data-nextround>${Math.max(...g.scores)>=g.target?"Voir le classement":"Carte suivante"}</button>`}
  else top=`<section class="gcard">
     <header class="band"><span class="catname">${esc(c.cat)}</span><span class="cno">Carte ${g.round+1}</span></header>
     <div class="gbody">
      <p class="label">Lecteur · ${esc(g.players[g.reader])}</p>
      <p class="turnline">Au tour de <strong>${esc(g.players[g.guesser])}</strong></p>
      <div class="meter"><span><b>${n}</b> indice${n>1?"s":""} lu${n>1?"s":""}</span><span>Prochain indice : <b>${Math.max(0,20-(n+1))}</b> pts</span></div>
      ${ansRow(c,g.showAnswer,"data-reveal")}

  const jsheet=S.jokerAsk!=null?`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Jeton de réponse">

    <p class="answerline">${esc(g.players[S.jokerAsk])}</p><p>répond hors de son tour. Le jeton est perdu dans les deux cas. Trouvé maintenant : <b>+${20-n} pts</b>.</p></div>
    <div class="row"><button class="ko" style="flex:1" data-jjudge="0">Raté</button><button class="ok" style="flex:1" data-jjudge="1">Trouvé !</button></div>
    <button class="link" data-jcancel>Annuler, garder le jeton</button>
  </div></div>`:"";
  const sheet=jsheet||(S.clueOpen?`<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Indice ${S.clueOpen}">
    <div class="flip"><div class="flip-in">
     <div class="face back" aria-hidden="true"><span class="bignum">${S.clueOpen}</span></div>
     <div class="face fiche" data-fiche><span class="fnum">${S.clueOpen}</span><span class="label">Lisez à voix haute</span><p class="clue" id="typed">${esc(c.clues[S.clueOpen-1])}</p></div>
    </div></div>
    ${ansRow(c,g.showAnswer,"data-reveal")}
    <p class="who">Réponse de <b>${esc(g.players[g.guesser])}</b> ?</p>
    <div class="row"><button class="ko big" style="flex:1" data-judge="0">Raté</button><button class="ok big" style="flex:1" data-judge="1">Trouvé !</button></div>
    ${jokerBar()}
    ${undoBtn()}
  </div></div>`:"");
  const sheetAll=S.adjust?adjustSheet():sheet;
  return `<div class="stack" style="${catStyle(c)};gap:14px">

function allClues(c,used){return `<div class="stack" style="gap:8px"><p class="label">Les 20 indices · ${used.length} lu${used.length>1?"s":""}</p><ol class="cluelist">${c.clues.map((t,i)=>`<li class="${used.includes(i+1)?"":"unread"}"><span>${i+1}</span><p>${esc(t)}</p></li>`).join("")}</ol></div>`}
function clueList(c,used){if(!used.length)return "";
 return `<div class="stack" style="gap:8px"><p class="label">Indices dévoilés (${used.length})</p><ol class="cluelist">${[...used].sort((x,y)=>x-y).map(k=>`<li class="${k===used[used.length-1]?"last":""}"><span>${k}</span><p>${esc(c.clues[k-1])}</p></li>`).join("")}</ol></div>`}
function scoreList(deltas){const g=S.game;deltas=deltas||{};const order=g.players.map((p,i)=>({p,s:g.scores[i],i})).sort((a,b)=>b.s-a.s);
 return `<div class="scores">${order.map(o=>`<div><span class="nm">${esc(o.p)}${g.tokens&&g.tokens[o.i]?` <span class="tag">· jeton</span>`:""}</span>${deltas[o.i]?`<span class="delta">+${deltas[o.i]}</span>`:""}<b data-from="${o.s-(deltas[o.i]||0)}" data-to="${o.s}">${o.s}</b></div>`).join("")}</div>`}

function final(){const g=S.game;const ord=g.players.map((p,i)=>({p,s:g.scores[i]})).sort((a,b)=>b.s-a.s);
 const max=ord[0].s;const win=ord.filter(o=>o.s===max).map(o=>o.p);
 const top=ord.slice(0,3);const slots=top.length===3?[1,0,2]:top.length===2?[1,0]:[0];const H={0:150,1:105,2:75},D={0:.5,1:.25,2:0};
 return `<div class="topbar"><span class="label">Fin de partie · objectif ${g.target} pts</span>${soundBtn()}</div>
 <h1 class="final-title">${win.map(esc).join(" & ")}<span>gagne${win.length>1?"nt":""} !</span></h1>
 <div class="podium" aria-label="Podium">${slots.map(k=>`<div class="pod r${k+1}" style="--h:${H[k]}px;--d:${D[k]}s"><div class="who2"><span class="medal">${k+1}</span><span class="pname">${esc(top[k].p)}</span><span class="pscore">${top[k].s}</span></div><div class="blk"></div></div>`).join("")}</div>
 ${ord.length>3?`<div class="panel scores">${ord.slice(3).map((o,j)=>`<div><span class="nm">${j+4}. ${esc(o.p)}</span><b>${o.s}</b></div>`).join("")}</div>`:""}
 ${undoBtn("block")}<button class="primary block big" data-go="setup">Rejouer</button><button class="block" data-go="home">Accueil</button>`}

 const top=`<div class="topbar"><button class="link" data-go="${b.from||"home"}">← ${b.from?"Liste des cartes":"Accueil"}</button>${soundBtn()}</div>

 if(!b.cards.length)return top+`<div class="panel"><p class="muted">Aucune carte dans les catégories choisies. Activez au moins une catégorie.</p></div>`;
 const c=b.cards[b.i];
 const seg=`<div class="seg" role="group" aria-label="Affichage"><button class="${b.mode==="hide"?"on":""}" data-bmode="hide" aria-pressed="${b.mode==="hide"}">Indices cachés</button><button class="${b.mode==="all"?"on":""}" data-bmode="all" aria-pressed="${b.mode==="all"}">Tous les indices</button></div>`;
 const head=`<section class="gcard"><header class="band"><span class="catname">${esc(c.cat)}</span><span class="cno">${b.cards.length>1?`Carte ${b.i+1} / ${b.cards.length}`:"Lecture libre"}</span></header>
   <div class="gbody">${b.mode==="all"?`<p class="label">La réponse</p><p class="answerline">${esc(c.answer)}</p>`:`<p class="muted">Touchez une gommette pour dévoiler l'indice.</p>${ansRow(c,b.showAnswer,"data-breveal")}`}</div></section>`;
 let body;
 if(b.mode==="all"){body=`<ol class="cluelist">${c.clues.map((t,i)=>`<li><span>${i+1}</span><p>${esc(t)}</p></li>`).join("")}</ol>`}
 else{body=`${board(b.used,"data-bn",false)}${clueList(c,b.used)}

 return `<div class="stack" style="${catStyle(c)};gap:14px">${top}${seg}${head}${body}

 ${S.confirmBDel===c.id?`<div class="row"><button class="small" style="flex:1" data-bdelno>Garder</button><button class="small ko" style="flex:1" data-bdel="${c.id}">Supprimer définitivement</button></div>`:`<button class="link" data-bdelask="${c.id}">Supprimer cette carte</button>`}</div>`}
function styles(){return `
 <div class="topbar"><button class="link" data-go="home">← Accueil</button>${soundBtn()}</div>
 <h2>Style du jeu</h2>
 <p class="muted">Choisissez l'habillage des cartes et de la table. Le choix est gardé sur ce téléphone.</p>
 <div class="styles">${STYLES.map(t=>`<button class="swatch ${S.style===t.id?"on":""}" data-style="${t.id}" data-pickstyle="${t.id}" aria-pressed="${S.style===t.id}">
   <span class="sw-card"><span class="sw-name">${esc(t.name)}</span><span class="sw-dots" aria-hidden="true"><i style="background:var(--red);color:var(--red-ink)">7</i><i style="background:var(--blue);color:var(--blue-ink)">12</i><i style="background:var(--yellow);color:var(--yellow-ink)">20</i></span></span>

function rules(){return `
 <div class="topbar"><button class="link" data-go="home">← Accueil</button>${soundBtn()}</div>
 <h2>Règles</h2>
 <div class="panel"><ol class="rules">
  <li>À chaque carte, un joueur devient <b>lecteur</b> et tient le téléphone. Il peut consulter la réponse discrètement.</li>
  <li>Le joueur dont c'est le tour annonce un numéro de 1 à 20. Le lecteur touche la gommette et lit l'indice à voix haute.</li>
  <li>Ce joueur propose une réponse. Le lecteur tape <b>Trouvé</b> ou <b>Raté</b>. En cas d'échec, on passe au joueur suivant.</li>
  <li>Si la réponse est trouvée après <i>n</i> indices, le devineur marque <b>20 − n</b> points et le lecteur marque <b>n</b> points : 20 points sont répartis à chaque carte.</li>
  <li>Si personne ne trouve après les 20 indices, le lecteur marque 20 points.</li>
  <li>Le rôle de lecteur tourne à chaque carte. Dès qu'un joueur atteint le score fixé au départ, la partie s'arrête à la fin de la carte : le plus haut score gagne.</li>
  <li>Option jeton : chaque joueur reçoit un jeton en début de partie. Il peut l'utiliser à n'importe quel moment pour répondre hors de son tour. Bonne ou mauvaise réponse, le jeton est perdu.</li>
  <li>Une erreur de saisie ? « Annuler la dernière action » remet les points et la carte comme avant. « Ajuster les scores » permet d'ajouter ou retirer des points à la main.</li>
  <li>Une carte trop difficile ou déjà vue ? Le lecteur peut la passer : personne ne marque, et il tire une nouvelle carte.</li>
 </ol></div>
 <button class="primary block big" data-go="setup">Jouer</button>`}

const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^(le |la |les |l'|l’)/,"");
function searchResults(){const q=norm((S.q||"").trim());const lc=S.lcat||"";
 const all=[...base(),...S.mine].filter(c=>(!lc||c.cat===lc)&&(!q||norm(c.answer).includes(q)));
 const lim=S.lim||40;
 if(!all.length)return `<p class="muted">Aucune carte ne correspond${q?` à « ${esc(S.q)} »`:""}.</p>`;
 const isMine=c=>S.mine.some(m=>m.id===c.id);
 return `<p class="label">${all.length} carte${all.length>1?"s":""}</p>`+all.slice(0,lim).map(c=>`<div class="card-item">
   <button class="linkrow" data-open="${c.id}"><b>${esc(c.answer)}</b><br><span class="tag"><i class="dot" style="background:${(CATC[c.cat]||CATC.Chose)[0]}"></i>${esc(c.cat)}${isMine(c)?" · ma carte":c.edited?" · modifiée":""}</span></button>
   <div class="row" style="flex-wrap:nowrap"><button class="small" data-edit="${c.id}">Modifier</button>
   ${S.confirmDel===c.id?`<button class="small ko" data-del="${c.id}">Confirmer</button>`:`<button class="small" data-askdel="${c.id}">Suppr.</button>`}</div></div>`).join("")
   +(all.length>lim?`<button class="small block" data-more style="margin-top:10px">Afficher ${Math.min(40,all.length-lim)} de plus</button>`:"")}
function exportAll(){
 const list=[...base().map(c=>({id:c.id,cat:c.cat,answer:c.answer,clues:c.clues,source:c.edited?"base-modifiée":"base"})),...S.mine.map(c=>({id:c.id,cat:c.cat,answer:c.answer,clues:c.clues,source:"perso"}))];
 const data=JSON.stringify({format:"vingt-indices",exportedAt:new Date().toISOString(),total:list.length,removedBaseIds:S.removed,cards:list},null,1);
 const d=new Date(),stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 const fname=`vingt-indices-cartes-${stamp}.json`;
 const clip=()=>{try{navigator.clipboard.writeText(data).then(()=>toast("Export copié : collez-le dans un fichier ou dans la conversation"),()=>toast("Export impossible sur cet appareil"))}catch(e){toast("Export impossible sur cet appareil")}};
 const copy=()=>{try{const file=new File([data],fname,{type:"application/json"});
   if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Cartes Vingt Indices"}).catch(e=>{if(e&&e.name!=="AbortError")clip()});return}
   if(!window.claude){const u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Fichier exporté");return}
  }catch(e){}clip()};
 Promise.resolve(window.claude?.use?.("downloads")).then(dl=>{
  if(!dl){copy();return}
  dl.save({filename:fname,data}).then(()=>toast("Fichier exporté"),err=>{
   if(err&&err.code==="declined")return;
   if(err&&err.code==="rate_limited"){toast("Un export est déjà en cours");return}
   copy()})
 }).catch(copy);
}

 <div class="panel stack"><p class="label">Exporter toutes les cartes</p>
  <p class="muted">Crée un fichier avec toutes les cartes telles qu'elles sont sur ce téléphone : modifications et suppressions comprises, plus vos cartes perso. Envoyez ce fichier à Claude pour mettre à jour le jeu pour tout le monde.</p>
  <button class="primary" data-exportall>Exporter (${[...base(),...S.mine].length} cartes)</button>
 </div>
 <div class="panel stack"><p class="label">Sauvegarde et partage</p>
  <p class="muted">Vos cartes perso restent sur ce téléphone. Copiez le code pour les transférer ou les partager, puis collez-le ici sur un autre appareil.</p>
  <div class="row"><button class="small" data-export>Copier mes cartes</button></div>
  <textarea id="importbox" rows="3" placeholder="Coller un code de cartes ici"></textarea>
  <button class="small" data-import>Importer</button>
 </div>`}

function editor(){const d=S.draft;return `
 <div class="topbar"><button class="link" data-go="cards">← Annuler</button><button class="primary small" data-savecard>Enregistrer</button></div>
 <h2>${d.id?"Modifier la carte":"Nouvelle carte"}</h2>
 ${d.id&&S.edits[d.id]?`<button class="link" data-resetedit="${d.id}">Rétablir la version d'origine</button>`:""}
 <div class="panel stack">
  <label class="stack" style="gap:6px"><span class="label">Catégorie</span><select id="ecat">${THEMES.map(c=>`<option ${d.cat===c?"selected":""}>${c}</option>`).join("")}</select></label>
  <label class="stack" style="gap:6px"><span class="label">Réponse</span><input id="eans" value="${esc(d.answer)}" placeholder="Ex. : Le phare d'Alexandrie"></label>
 </div>
 <div class="panel stack">
  <p class="label">20 indices · mélangez des faciles et des difficiles</p>
  <div class="clue-inputs">${d.clues.map((c,i)=>`<span>${i+1}</span><input id="ec${i}" data-ci="${i}" value="${esc(c)}" placeholder="Indice ${i+1}" aria-label="Indice ${i+1}">`).join("")}</div>
 </div>
 <button class="primary block big" data-savecard>Enregistrer la carte</button>`}

/* ---------- animations après rendu ---------- */
let PREV={};
function fxState(){const g=S.game,b=S.browse;
  const inRound=S.view==="round"&&g,inBrowse=S.view==="browse"&&b&&b.cards.length;
  return {view:S.view,
    card:inRound?"g"+g.round+"-"+(g.skip||0):inBrowse?"b"+b.i+"-"+b.cards[b.i].id:null,
    used:inRound?g.used.length:inBrowse?b.used.length:0,
    clue:inRound&&!S.jokerAsk&&!S.adjust?S.clueOpen:null,
    overlay:inRound?(S.adjust?"adj":S.jokerAsk!=null?"j"+S.jokerAsk:S.clueOpen?"c"+S.clueOpen:null):null,
    result:inRound&&g.result?"r"+g.round+"-"+(g.skip||0):null};
}
let typingTimer=null;
function finishTyping(){clearTimeout(typingTimer);const el=document.getElementById("typed");if(el&&el.dataset.full){el.textContent=el.dataset.full;el.classList.remove("typing");delete el.dataset.full}}
function typeIt(){const el=document.getElementById("typed");if(!el||REDUCE)return;const full=el.textContent;el.dataset.full=full;el.textContent="";el.classList.add("typing");let i=0;
  const step=()=>{if(!el.isConnected)return;i++;el.textContent=full.slice(0,i);if(i%3===1)SFX.tick();if(i<full.length)typingTimer=setTimeout(step,i%12===0?40:17);else{el.classList.remove("typing");delete el.dataset.full}};
  typingTimer=setTimeout(step,560)}
function countUp(animate){document.querySelectorAll("[data-to]").forEach(el=>{const a=+el.dataset.from,b=+el.dataset.to;if(!animate||REDUCE||a===b){el.textContent=b;return}
  const t0=performance.now()+250,dur=750;el.textContent=a;(function f(now){const p=Math.max(0,Math.min(1,(now-t0)/dur));el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-p,3)));if(p<1&&el.isConnected)requestAnimationFrame(f)})(performance.now())})}
function after(){const cur=fxState();
  if(S.noFx){S.noFx=false;PREV=cur;return}
  const app=document.getElementById("app");
  if(cur.view!==PREV.view){app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter")}else app.classList.remove("enter");
  if(cur.card&&cur.card!==PREV.card){const gc=app.querySelector(".gcard");if(gc&&!REDUCE)gc.classList.add("deal");SFX.deal()}
  if(cur.overlay&&cur.overlay!==PREV.overlay){const o=app.querySelector(".overlay");if(o)o.classList.add("in")}
  if(cur.clue&&cur.clue!==PREV.clue){const f=app.querySelector(".flip");if(f)f.classList.add("go");setTimeout(()=>SFX.flip(),120);typeIt()}
  if(cur.card===PREV.card&&!cur.clue&&(cur.used>PREV.used||PREV.clue)){const li=app.querySelector(".cluelist li.last");if(li)li.classList.add("pop")}
  if(cur.result&&cur.result!==PREV.result){const st=app.querySelector(".stamp");if(st)st.classList.add("go");app.querySelectorAll(".delta").forEach(x=>x.classList.add("go"));countUp(true);
    const found=S.game.result.found;setTimeout(()=>SFX.stamp(),170);setTimeout(()=>found?SFX.ok():SFX.ko(),330);if(found)setTimeout(()=>confetti(false),260)}
  if(cur.view==="final"&&PREV.view!=="final"){const p=app.querySelector(".podium");if(p)p.classList.add("go");setTimeout(()=>{SFX.win();confetti(true)},700)}
  PREV=cur;
}

/* ---------- événements ---------- */
function syncDraft(){if(S.view!=="editor")return;const d=S.draft;d.cat=document.getElementById("ecat").value;d.answer=document.getElementById("eans").value;d.clues=d.clues.map((_,i)=>document.getElementById("ec"+i).value)}
function syncPlayers(){if(S.view!=="setup")return;document.querySelectorAll("[data-p]").forEach(el=>S.players[+el.dataset.p]=el.value)}
function peelThen(btn,fn){if(S.busy)return;if(REDUCE){fn();return}S.busy=true;btn.classList.add("peel");SFX.peel();setTimeout(()=>{S.busy=false;fn()},190)}
function bind(){
  const a=document.getElementById("app");
  a.onclick=e=>{
    if(e.target.closest("[data-fiche]")){finishTyping();return}
    const b=e.target.closest("button,input[type=checkbox]");if(!b)return;const d=b.dataset;
    if(d.go){syncPlayers();S.view=d.go;S.confirmDel=null;render();window.scrollTo(0,0)}
    else if(d.pickstyle){S.style=d.pickstyle;save();S.noFx=true;render();SFX.soft()}
    else if("sound" in d){S.sound=!S.sound;save();render();if(S.sound)SFX.soft()}
    else if("addp" in d){syncPlayers();S.players.push("");save();render();const l=document.querySelectorAll("[data-p]");l[l.length-1].focus()}
    else if(d.delp){syncPlayers();S.players.splice(+d.delp,1);save();render()}
    else if(d.theme){syncPlayers();const t=d.theme;S.off=S.off.includes(t)?S.off.filter(x=>x!==t):[...S.off,t];save();render()}
    else if(d.target){syncPlayers();S.target=+d.target;save();render()}
    else if("start" in d){syncPlayers();const v=document.getElementById("targetin");if(v)S.target=+v.value;startGame()}
    else if(d.n){peelThen(b,()=>pick(+d.n))}
    else if(d.bdelask){S.confirmBDel=d.bdelask;render()}
    else if("bdelno" in d){S.confirmBDel=null;render()}
    else if(d.bdel){const id=d.bdel,bb=S.browse,ans=bb.cards[bb.i].answer;removeCard(id);S.confirmBDel=null;bb.cards=bb.cards.filter(c=>c.id!==id);bb.used=[];bb.showAnswer=false;
      if(bb.from&&!bb.cards.length){S.view="cards";}else if(bb.i>=bb.cards.length)bb.i=0;render();toast(`« ${ans} » supprimée`)}
    else if(d.restore){S.removed=S.removed.filter(x=>x!==d.restore);save();render();toast("Carte restaurée")}
    else if("restoreall" in d){S.removed=[];save();render();toast("Toutes les cartes restaurées")}
    else if(d.open){const c=[...base(),...S.mine].find(x=>x.id===d.open);S.browse={cards:[c],i:0,mode:"hide",used:[],showAnswer:false,from:"cards"};S.view="browse";render();window.scrollTo(0,0)}
    else if("browse" in d){newBrowse();S.view="browse";render();window.scrollTo(0,0)}
    else if(d.btheme){const t=d.btheme;S.off=S.off.includes(t)?S.off.filter(x=>x!==t):[...S.off,t];save();newBrowse();render()}
    else if(d.bmode){S.browse.mode=d.bmode;render()}
    else if(d.bn){peelThen(b,()=>{S.browse.used.push(+d.bn);render()})}
    else if("ball" in d){const bb=S.browse;for(let k=1;k<=20;k++)if(!bb.used.includes(k))bb.used.push(k);render()}
    else if("breveal" in d){S.browse.showAnswer=!S.browse.showAnswer;render()}
    else if("bnext" in d||"bprev" in d){const bb=S.browse;bb.i=("bnext" in d)?(bb.i+1)%bb.cards.length:Math.max(0,bb.i-1);bb.used=[];bb.showAnswer=false;render();window.scrollTo(0,0)}
    else if(d.judge){finishTyping();judge(d.judge==="1")}
    else if("undo" in d){undo()}
    else if("adjust" in d){S.adjust=true;render()}
    else if("adjdone" in d){S.adjust=false;render()}
    else if(d.adj){const [i,v]=d.adj.split(":").map(Number);snap();S.game.scores[i]+=v;render()}
    else if(d.joker){finishTyping();S.jokerAsk=+d.joker;render()}
    else if(d.jjudge){jokerJudge(d.jjudge==="1")}
    else if("jcancel" in d){S.jokerAsk=null;render()}
    else if("skip" in d){S.confirmSkip=true;render()}
    else if("skipno" in d){S.confirmSkip=false;render()}
    else if("skipyes" in d){skipCard()}
    else if("showall" in d){S.game.showAll=!S.game.showAll;S.noFx=true;render();if(S.game.showAll){const l=document.querySelector(".cluelist");if(l)l.scrollIntoView({behavior:REDUCE?"auto":"smooth",block:"start"})}}
    else if("reveal" in d){S.game.showAnswer=!S.game.showAnswer;render()}
    else if("nextround" in d){nextRound();window.scrollTo(0,0)}
    else if("quit" in d){S.view="home";S.game=null;S.hist=[];render()}
    else if("new" in d){S.draft={id:null,cat:"Personnage",answer:"",clues:Array(20).fill("")};S.view="editor";render()}
    else if(d.edit){const c=[...S.mine,...base()].find(x=>x.id===d.edit);S.draft={id:c.id,cat:c.cat,answer:c.answer,clues:[...c.clues]};S.view="editor";render();window.scrollTo(0,0)}
    else if(d.resetedit){delete S.edits[d.resetedit];save();S.view="cards";render();toast("Version d'origine rétablie")}
    else if(d.lcat!==undefined){S.lcat=d.lcat;S.lim=40;render()}
    else if("more" in d){S.lim=(S.lim||40)+40;refreshList()}
    else if(d.askdel){S.confirmDel=d.askdel;refreshList()}
    else if(d.del){removeCard(d.del);S.confirmDel=null;render();toast("Carte supprimée")}
    else if("savecard" in d){syncDraft();const dr=S.draft;
      if(!dr.answer.trim()){toast("Indiquez la réponse");return}
      const missing=dr.clues.filter(c=>!c.trim()).length;
      if(missing){toast(`Il manque ${missing} indice${missing>1?"s":""}`);return}
      if(dr.id&&S.mine.some(x=>x.id===dr.id)){S.mine=S.mine.map(x=>x.id===dr.id?dr:x)}
      else if(dr.id){S.edits[dr.id]={cat:dr.cat,answer:dr.answer.trim(),clues:dr.clues}}
      else{dr.id="m"+Date.now();S.mine.push(dr)}
      save();S.view="cards";render();toast("Carte enregistrée")}
    else if("exportall" in d){exportAll()}
    else if("export" in d){const code=JSON.stringify(S.mine);const box=document.getElementById("importbox");
      const fallback=()=>{box.value=code;box.select();toast("Code affiché : copiez-le")};
      try{navigator.clipboard.writeText(code).then(()=>toast("Cartes copiées"),fallback)}catch(err){fallback()}}
    else if("import" in d){try{const arr=JSON.parse(document.getElementById("importbox").value);
      const ok=arr.filter(c=>c&&c.answer&&Array.isArray(c.clues)&&c.clues.length===20).map((c,i)=>({id:"m"+Date.now()+"_"+i,cat:toCat(c.cat||""),answer:String(c.answer),clues:c.clues.map(String)}));
      if(!ok.length)throw 0;S.mine.push(...ok);save();render();toast(`${ok.length} carte${ok.length>1?"s":""} importée${ok.length>1?"s":""}`)}
      catch(err){toast("Code invalide : collez le texte copié depuis « Copier mes cartes »")}}
  };
  a.onchange=e=>{if(e.target.id==="usetokens"){S.useTokens=e.target.checked;save();return}if(e.target.id==="usebuiltin"){S.useBuiltin=e.target.checked;save();render()}};
  a.oninput=e=>{if(e.target.id==="search"){S.q=e.target.value;S.lim=40;refreshList();return}if(e.target.id==="targetin"){S.target=+e.target.value;save();document.querySelectorAll("[data-target]").forEach(b=>b.classList.toggle("on",+b.dataset.target===S.target));return}if(e.target.dataset.p!==undefined){S.players[+e.target.dataset.p]=e.target.value;save()}};
}

/* Bandeau de mise à jour : appelé par l'appli installée quand une nouvelle version est prête */
window.VI_showUpdate=function(apply){const u=document.getElementById("update"),btn=document.getElementById("updbtn");if(!u)return;u.hidden=false;
  btn.onclick=()=>{btn.disabled=true;btn.textContent="Mise à jour…";try{apply()}catch(e){location.reload()}}};

function start(data){if(data&&data.S){S=data.S;S.clueOpen=null;S.busy=false;S.noFx=true}render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

<script>
/* Mise à jour : la nouvelle version s'installe en arrière-plan, puis le bandeau propose de l'appliquer. */
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const ask=w=>{if(w&&navigator.serviceWorker.controller&&window.VI_showUpdate)window.VI_showUpdate(()=>w.postMessage("skipWaiting"))};
      // Suit une version en cours de téléchargement jusqu'à ce qu'elle soit prête.
      const track=w=>{if(w)w.addEventListener("statechange",()=>{if(w.state==="installed")ask(w)})};
      if(reg.waiting)ask(reg.waiting);
      track(reg.installing);
      reg.addEventListener("updatefound",()=>track(reg.installing));
      // Au retour dans l'appli : cherche une nouvelle version, et repropose celle déjà téléchargée.
      const check=()=>reg.update().catch(()=>{}).then(()=>{if(reg.waiting)ask(reg.waiting)});
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
      setTimeout(check,3000);
    }).catch(()=>{});
  });
}
</script>
