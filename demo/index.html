const mascotSVG=()=>{const s=document.querySelector("#mascot svg");return s?s.outerHTML:""};
let mascotKey=null,mascotTimer=null;
function mood(){const g=S.game;
  switch(S.view){
    case "home":return null; // sur l'accueil, c'est la grande mascotte au centre qui parle
    case "setup":return ["wave","Qui joue avec moi ?"];
    case "rules":return ["point","Tout est expliqué ici !"];
    case "cards":return ["think","Que de cartes…"];
    case "editor":return ["point","20 indices, pas un de moins !"];
    case "styles":return ["cheer","Choisis mon look !"];
    case "browse":return ["think","Saurais-tu deviner ?"];
    case "final":return ["cheer","Quelle partie !"];
    case "round":{
      if(!g)return null;
      const r=g.result,n=g.used.length,who=g.players[g.guesser];
      if(r)return r.found?["cheer",`Bravo ${g.players[r.who]} !`]:["sad","Personne ? Dommage !"];
      if(S.clueOpen)return n>=15?["shock",`Déjà ${n} indices ?!`]:["think","Alors, ça te dit quelque chose ?"];
      if(!n)return ["wave",`À toi, ${who} : choisis un numéro !`];
      return ["sad",`Raté ! À toi, ${who} !`];
    }
  }
  return null}
/* Choisit, parmi quelques emplacements (coins et bords), celui où la mascotte et sa bulle
   recouvrent le moins de boutons et de texte. */
function placeMascot(el,line){
  const W=innerWidth,H=innerHeight,cs=getComputedStyle(document.documentElement);
  const st=(parseFloat(cs.paddingTop)||0)+6,sb=(parseFloat(cs.paddingBottom)||0)+6;
  const w=el.offsetWidth||68,h=w*190/144;
  const lineOn=!line.hidden;
  const bw=lineOn?Math.min(line.offsetWidth||150,W-24):0,bh=lineOn?(line.offsetHeight||30):0;
  const ov=document.querySelector(".overlay .sheet");
  const root=ov||document.getElementById("app");
  const sel="button,input,select,textarea,h1,h2,p,li,.label,.n,.pl,.fc,.ansrow,.band,.stamp,.scores>div,.pod,.mbubble";
  // boutons, titres et gommettes comptent double : c'est ce qu'il faut le moins cacher
  const heavy=e=>e.matches("button,input,select,textarea,h1,h2,.n,.fc,.stamp");
  const rects=[...root.querySelectorAll(sel)].filter(e=>!e.closest(".mascot")).map(e=>{const r=e.getBoundingClientRect();r.k=heavy(e)?2:1;return r}).filter(r=>r.width&&r.height&&r.bottom>0&&r.top<H);
  if(ov)rects.push(...[...ov.querySelectorAll(".face")].map(e=>{const r=e.getBoundingClientRect();r.k=2;return r}));
  const inter=(a,b)=>Math.max(0,Math.min(a.r,b.right)-Math.max(a.l,b.left))*Math.max(0,Math.min(a.b,b.bottom)-Math.max(a.t,b.top));
  const xs=[W-w-8,8],ys=[H-h-sb,H*.58-h/2,H*.36-h/2,st+60];
  let best=null,k=0;
  ys.forEach(y=>xs.forEach(x=>["up","mid","down"].forEach(v=>{
    const right=x>W/2,boxes=[{l:x,t:y,r:x+w,b:y+h}],rank=k++;
    if(lineOn){const bl=right?x+w*.22-bw:x+w*.78,bt=v==="down"?y+h*.92:v==="mid"?y+h*.2:y+h*.14-bh;
      if(bl<4||bl+bw>W-4||bt<st||bt+bh>H-sb)return;boxes.push({l:bl,t:bt,r:bl+bw,b:bt+bh})}
    else if(v!=="up")return;
    let score=0;boxes.forEach(bx=>rects.forEach(r=>score+=inter(bx,r)*r.k));
    score+=rank*15; // à égalité : de préférence en bas à droite
    if(!best||score<best.score)best={score,x,y,right,v};
  })));
  if(!best)best={x:W-w-8,y:H-h-sb,right:true,v:"up"};
  el.style.left=best.x+"px";el.style.top=best.y+"px";
  el.classList.toggle("bub-r",!best.right);el.classList.toggle("bub-down",best.v==="down");el.classList.toggle("bub-mid",best.v==="mid");
  el.style.transformOrigin="50% 100%";
}
function react(){const el=document.getElementById("mascot"),line=document.getElementById("mascotLine");if(!el)return;
  const g=S.game;
  const key=S.view==="round"&&g?["round",g.round,g.skip||0,g.used.length,S.clueOpen||0,g.result?1:0].join("|"):S.view;
  if(key===mascotKey)return;mascotKey=key;
  const m=mood();clearTimeout(mascotTimer);
  if(!m){el.className="mascot";return}
  if(el.classList.contains("show"))el.classList.replace("show","leave");
  // on attend que l'écran ait fini ses animations d'entrée pour mesurer l'endroit le plus dégagé
  mascotTimer=setTimeout(()=>{
    line.textContent=m[1];line.hidden=!m[1];
    el.className="mascot "+m[0];placeMascot(el,line);void el.offsetWidth;el.classList.add("show");
    mascotTimer=setTimeout(()=>el.classList.replace("show","leave"),2800)},REDUCE?0:480)}

/* ---------- animations après rendu ---------- */
let PREV={};
function fxState(){const g=S.game,b=S.browse;
  const inRound=S.view==="round"&&g,inBrowse=S.view==="browse"&&b&&b.cards.length;
  return {view:S.view,
    card:inRound?"g"+g.round+"-"+(g.skip||0):inBrowse?"b"+b.i+"-"+b.cards[b.i].id:null,
    used:inRound?g.used.length:inBrowse?b.used.length:0,
    clue:inRound&&!S.jokerAsk&&!S.adjust?S.clueOpen:null,
    overlay:inRound?(S.adjust?"adj":S.jokerAsk!=null?"j"+S.jokerAsk:S.clueOpen?"c"+S.clueOpen:null):null,
    result:inRound&&g.result?"r"+g.round+"-"+(g.skip||0):null};
}
let typingTimer=null;
function finishTyping(){clearTimeout(typingTimer);const el=document.getElementById("typed");if(el&&el.dataset.full){el.textContent=el.dataset.full;el.classList.remove("typing");delete el.dataset.full}}
function typeIt(){const el=document.getElementById("typed");if(!el||REDUCE)return;const full=el.textContent;el.dataset.full=full;el.textContent="";el.classList.add("typing");let i=0;
  const step=()=>{if(!el.isConnected)return;i++;el.textContent=full.slice(0,i);if(i%3===1)SFX.tick();if(i<full.length)typingTimer=setTimeout(step,i%12===0?40:17);else{el.classList.remove("typing");delete el.dataset.full}};
  typingTimer=setTimeout(step,560)}
function countUp(animate){document.querySelectorAll("[data-to]").forEach(el=>{const a=+el.dataset.from,b=+el.dataset.to;if(!animate||REDUCE||a===b){el.textContent=b;return}
  const t0=performance.now()+250,dur=750;el.textContent=a;(function f(now){const p=Math.max(0,Math.min(1,(now-t0)/dur));el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-p,3)));if(p<1&&el.isConnected)requestAnimationFrame(f)})(performance.now())})}
function after(){const cur=fxState();react();
  if(S.noFx){S.noFx=false;PREV=cur;return}
  const app=document.getElementById("app");
  if(cur.view!==PREV.view){app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter")}else app.classList.remove("enter");
  if(cur.card&&cur.card!==PREV.card){const gc=app.querySelector(".gcard");if(gc&&!REDUCE)gc.classList.add("deal");SFX.deal()}
  if(cur.overlay&&cur.overlay!==PREV.overlay){const o=app.querySelector(".overlay");if(o)o.classList.add("in")}
  if(cur.clue&&cur.clue!==PREV.clue){const f=app.querySelector(".flip");if(f)f.classList.add("go");setTimeout(()=>SFX.flip(),120);typeIt()}
  if(cur.card===PREV.card&&!cur.clue&&(cur.used>PREV.used||PREV.clue)){const li=app.querySelector(".cluelist li.last");if(li)li.classList.add("pop")}
  if(cur.result&&cur.result!==PREV.result){const st=app.querySelector(".stamp");if(st)st.classList.add("go");app.querySelectorAll(".delta").forEach(x=>x.classList.add("go"));countUp(true);
    const found=S.game.result.found;setTimeout(()=>SFX.stamp(),170);setTimeout(()=>found?SFX.ok():SFX.ko(),330);if(found)setTimeout(()=>confetti(false),260)}
  if(cur.view==="final"&&PREV.view!=="final"){const p=app.querySelector(".podium");if(p)p.classList.add("go");setTimeout(()=>{SFX.win();confetti(true)},700)}
  PREV=cur;
}

/* ---------- événements ---------- */
function syncDraft(){if(S.view!=="editor")return;const d=S.draft;d.cat=document.getElementById("ecat").value;d.answer=document.getElementById("eans").value;d.clues=d.clues.map((_,i)=>document.getElementById("ec"+i).value)}
function syncPlayers(){if(S.view!=="setup")return;document.querySelectorAll("[data-p]").forEach(el=>S.players[+el.dataset.p]=el.value)}
function peelThen(btn,fn){if(S.busy)return;if(REDUCE){fn();return}S.busy=true;btn.classList.add("peel");SFX.peel();setTimeout(()=>{S.busy=false;fn()},190)}
function bind(){
  const a=document.getElementById("app");
  a.onclick=e=>{
    if(e.target.closest("[data-fiche]")){finishTyping();return}
    const b=e.target.closest("button,input[type=checkbox]");if(!b)return;const d=b.dataset;
    if(d.go){syncPlayers();S.view=d.go;S.confirmDel=null;render();window.scrollTo(0,0)}
    else if(d.pickstyle){S.style=d.pickstyle;S.styleChosen=true;save();S.noFx=true;render();SFX.soft()}
    else if("sound" in d){S.sound=!S.sound;save();render();if(S.sound)SFX.soft()}
    else if("addp" in d){syncPlayers();S.players.push("");save();render();const l=document.querySelectorAll("[data-p]");l[l.length-1].focus()}
    else if(d.delp){syncPlayers();S.players.splice(+d.delp,1);save();render()}
    else if(d.theme){syncPlayers();const t=d.theme;S.off=S.off.includes(t)?S.off.filter(x=>x!==t):[...S.off,t];save();render()}
    else if(d.target){syncPlayers();S.target=+d.target;save();render()}
    else if("start" in d){syncPlayers();const v=document.getElementById("targetin");if(v)S.target=+v.value;startGame()}
    else if(d.n){peelThen(b,()=>pick(+d.n))}
    else if(d.bdelask){S.confirmBDel=d.bdelask;render()}
    else if("bdelno" in d){S.confirmBDel=null;render()}
    else if(d.bdel){const id=d.bdel,bb=S.browse,ans=bb.cards[bb.i].answer;removeCard(id);S.confirmBDel=null;bb.cards=bb.cards.filter(c=>c.id!==id);bb.used=[];bb.showAnswer=false;
      if(bb.from&&!bb.cards.length){S.view="cards";}else if(bb.i>=bb.cards.length)bb.i=0;render();toast(`« ${ans} » supprimée`)}
    else if(d.restore){S.removed=S.removed.filter(x=>x!==d.restore);save();render();toast("Carte restaurée")}
    else if("restoreall" in d){S.removed=[];save();render();toast("Toutes les cartes restaurées")}
    else if(d.open){const c=[...base(),...S.mine].find(x=>x.id===d.open);S.browse={cards:[c],i:0,mode:"hide",used:[],showAnswer:false,from:"cards"};S.view="browse";render();window.scrollTo(0,0)}
    else if("browse" in d){newBrowse();S.view="browse";render();window.scrollTo(0,0)}
    else if(d.btheme){const t=d.btheme;S.off=S.off.includes(t)?S.off.filter(x=>x!==t):[...S.off,t];save();newBrowse();render()}
    else if(d.bmode){S.browse.mode=d.bmode;render()}
    else if(d.bn){peelThen(b,()=>{S.browse.used.push(+d.bn);render()})}
    else if("ball" in d){const bb=S.browse;for(let k=1;k<=20;k++)if(!bb.used.includes(k))bb.used.push(k);render()}
    else if("breveal" in d){S.browse.showAnswer=!S.browse.showAnswer;render()}
    else if("bnext" in d||"bprev" in d){const bb=S.browse;bb.i=("bnext" in d)?(bb.i+1)%bb.cards.length:Math.max(0,bb.i-1);bb.used=[];bb.showAnswer=false;render();window.scrollTo(0,0)}
    else if(d.judge){finishTyping();judge(d.judge==="1")}
    else if("undo" in d){undo()}
    else if("adjust" in d){S.adjust=true;render()}
    else if("adjdone" in d){S.adjust=false;render()}
    else if(d.adj){const [i,v]=d.adj.split(":").map(Number);snap();S.game.scores[i]+=v;render()}
    else if(d.joker){finishTyping();S.jokerAsk=+d.joker;render()}
    else if(d.jjudge){jokerJudge(d.jjudge==="1")}
    else if("jcancel" in d){S.jokerAsk=null;render()}
    else if("skip" in d){S.confirmSkip=true;render()}
    else if("skipno" in d){S.confirmSkip=false;render()}
    else if("skipyes" in d){skipCard()}
    else if("playedshow" in d){syncPlayers();S.playedShow=!S.playedShow;save();render()}
    else if("playedask" in d){syncPlayers();S.confirmPlayed=true;render()}
    else if("playedno" in d){S.confirmPlayed=false;render()}
    else if("playedreset" in d){S.played={};S.confirmPlayed=false;save();render();toast("Cartes jouées oubliées")}
    else if("showall" in d){S.game.showAll=!S.game.showAll;S.noFx=true;render();if(S.game.showAll){const l=document.querySelector(".cluelist");if(l)l.scrollIntoView({behavior:REDUCE?"auto":"smooth",block:"start"})}}
    else if("reveal" in d){S.game.showAnswer=!S.game.showAnswer;render()}
    else if("nextround" in d){nextRound();window.scrollTo(0,0)}
    else if("quit" in d){S.view="home";S.game=null;S.hist=[];render()}
    else if("new" in d){S.draft={id:null,cat:"Personnage",answer:"",clues:Array(20).fill("")};S.view="editor";render()}
    else if(d.edit){const c=[...S.mine,...base()].find(x=>x.id===d.edit);S.draft={id:c.id,cat:c.cat,answer:c.answer,clues:[...c.clues]};S.view="editor";render();window.scrollTo(0,0)}
    else if(d.resetedit){delete S.edits[d.resetedit];save();S.view="cards";render();toast("Version d'origine rétablie")}
    else if(d.lcat!==undefined){S.lcat=d.lcat;S.lim=40;render()}
    else if(d.lplay!==undefined){S.lplay=d.lplay;S.lim=40;render()}
    else if("more" in d){S.lim=(S.lim||40)+40;refreshList()}
    else if(d.askdel){S.confirmDel=d.askdel;refreshList()}
    else if(d.del){removeCard(d.del);S.confirmDel=null;render();toast("Carte supprimée")}
    else if("savecard" in d){syncDraft();const dr=S.draft;
      if(!dr.answer.trim()){toast("Indiquez la réponse");return}
      const missing=dr.clues.filter(c=>!c.trim()).length;
      if(missing){toast(`Il manque ${missing} indice${missing>1?"s":""}`);return}
      if(dr.id&&S.mine.some(x=>x.id===dr.id)){S.mine=S.mine.map(x=>x.id===dr.id?dr:x)}
      else if(dr.id){S.edits[dr.id]={cat:dr.cat,answer:dr.answer.trim(),clues:dr.clues}}
      else{dr.id="m"+Date.now();S.mine.push(dr)}
      save();S.view="cards";render();toast("Carte enregistrée")}
    else if("exportall" in d){exportAll()}
    else if("export" in d){const code=JSON.stringify(S.mine);const box=document.getElementById("importbox");
      const fallback=()=>{box.value=code;box.select();toast("Code affiché : copiez-le")};
      try{navigator.clipboard.writeText(code).then(()=>toast("Cartes copiées"),fallback)}catch(err){fallback()}}
    else if("import" in d){try{const arr=JSON.parse(document.getElementById("importbox").value);
      const ok=arr.filter(c=>c&&c.answer&&Array.isArray(c.clues)&&c.clues.length===20).map((c,i)=>({id:"m"+Date.now()+"_"+i,cat:toCat(c.cat||""),answer:String(c.answer),clues:c.clues.map(String)}));
      if(!ok.length)throw 0;S.mine.push(...ok);save();render();toast(`${ok.length} carte${ok.length>1?"s":""} importée${ok.length>1?"s":""}`)}
      catch(err){toast("Code invalide : collez le texte copié depuis « Copier mes cartes »")}}
  };
  a.onchange=e=>{if(e.target.id==="usetokens"){S.useTokens=e.target.checked;save();return}if(e.target.id==="usebuiltin"){S.useBuiltin=e.target.checked;save();render()}};
  a.oninput=e=>{if(e.target.id==="search"){S.q=e.target.value;S.lim=40;refreshList();return}if(e.target.id==="targetin"){S.target=+e.target.value;save();document.querySelectorAll("[data-target]").forEach(b=>b.classList.toggle("on",+b.dataset.target===S.target));return}if(e.target.dataset.p!==undefined){S.players[+e.target.dataset.p]=e.target.value;save()}};
}

    <script>
    /* Mise à jour : la nouvelle version s'installe en arrière-plan, puis le bandeau propose de l'appliquer. */
    if("serviceWorker" in navigator){
      let reloading=false;
      navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("sw.js").then(reg=>{
          const ask=w=>{if(w&&navigator.serviceWorker.controller&&window.VI_showUpdate)window.VI_showUpdate(()=>w.postMessage("skipWaiting"))};
          // Suit une version en cours de téléchargement jusqu'à ce qu'elle soit prête.
          const track=w=>{if(w)w.addEventListener("statechange",()=>{if(w.state==="installed")ask(w)})};
          if(reg.waiting)ask(reg.waiting);
          track(reg.installing);
          reg.addEventListener("updatefound",()=>track(reg.installing));
          // Au retour dans l'appli : cherche une nouvelle version, et repropose celle déjà téléchargée.
          const check=()=>reg.update().catch(()=>{}).then(()=>{if(reg.waiting)ask(reg.waiting)});
          document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});
          setTimeout(check,3000);
        }).catch(()=>{});
      });
    }
    </script>
